<style>

 b,.mod small{display:block}.mod small{color:var(--muted);font-size:11px}.filters{display:grid;grid-template-columns:140px minmax(0,1fr);gap:9px;margin-top:13px}select,input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:white;color:var(--ink);min-width:0}.papers{max-height:450px;overflow:auto;margin-top:12px;border-top:1px solid var(--line)}.paper{padding:11px 0;border-bottom:1px solid #eef1f5;display:flex;align-items:center;justify-content:space-between;gap:10px}.paper strong{font-size:13px;font-weight:500;line-height:1.4}.paper span{color:var(--muted);font-size:11px;display:block}.btn{border:0;background:var(--blue);color:#fff;padding:9px 14px;border-radius:10px;font-weight:600;white-space:nowrap}.btn.soft{background:#edf2fd;color:#365d9d}.btn.outline{border:1px solid var(--line);color:var(--ink);background:white}.btn.red{background:#fff0f0;color:#af4c4c}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.quiet{font-size:12px;color:var(--muted);margin:12px 0}.qtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.bar{height:6px;background:#edf1f8;border-radius:5px;overflow:hidden;margin:16px 0 24px}.bar i{display:block;height:100%;background:var(--blue)}.stem{font-size:17px;line-height:1.9;overflow-wrap:anywhere}.stem p,.rich p{margin:0 0 10px}.rich img{max-width:100%;height:auto;vertical-align:middle}.rich{overflow-wrap:anywhere}.material{background:#f8faff;border:1px solid #e5ecfd;border-radius:12px;padding:13px;margin:0 0 20px}.material summary{cursor:pointer;font-weight:700}.material>div{margin-top:12px}.options{display:grid;gap:10px;margin:22px 0}.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px;width:100%;color:var(--ink)}.opt .letter{font-weight:700;color:#536583;min-width:20px}.opt .rich{flex:1;min-width:0}.opt.selected{border-color:var(--blue);background:#f0f5ff}.opt.correct{border-color:#19a47a;background:#effaf6}.opt.incorrect{border-color:#d46a6a;background:#fff0f0}.answer{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}.answer h3{font-size:16px;margin:0 0 10px}.end{border-top:1px solid var(--line);padding-top:18px;margin-top:16px}.entry{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.entry b{font-size:14px;display:block}.entry small{color:var(--muted)}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}footer{max-width:1100px;margin:auto;padding:10px 20px 35px;font-size:12px;color:var(--muted)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#25364b;color:white;border-radius:10px;padding:12px 18px;display:none;z-index:20}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:750px){.layout{display:block;margin:14px auto;padding:0 12px}.side{position:static;display:flex;gap:6px;overflow:auto;margin-bottom:13px}.side h4{display:none}.nav{width:auto;white-space:nowrap;flex-shrink:0;font-size:13px;padding:9px}.card{padding:15px}.mods{grid-template-columns:repeat(2,1fr)}.stats{gap:7px}.stat{padding:11px 8px}.stat b{font-size:20px}.stat span{font-size:10px}.filters{grid-template-columns:102px minmax(0,1fr)}.stem{font-size:16px}.paper .btn{padding:7px 10px}h1{font-size:24px}}
</style></head><body><header><div><div><b>行测研习</b><small>公考真题 · 专项学习</small></div><span class="tag">2016—2026</span></div></header><div class="layout"><aside class="side"><h4>学习空间</h4><button class="nav active" data-view="home">◎ 题库练习</button><button class="nav" data-view="wrong">↻ 错题重做</button><button class="nav" data-view="fav">☆ 收藏题</button><button class="nav" data-view="records">▤ 学习记录</button></aside><main id="app"><div class="card">正在载入题库目录……</div></main></div><footer>资料来源：<a href="https://github.com/ERRRC/xingcezhenti" target="_blank" rel="noopener">ERRRC/xingcezhenti</a>（原题库作者）。本站为独立学习界面，不代表官方或原作者；题目、答案和解析请自行核对。</footer><div id="toast"></div>
<script>
(function(){'use strict';
var MOD=['01-政治理论','02-常识判断','03-言语理解与表达','04-数量关系','05-判断推理','06-资料分析'];
var COUNTS=[2305,9163,16000,6448,16859,8115];var KEY='xingce_review_v1';var app=document.getElementById('app'),manifest=null,group=2,year='2025',search='',limit=70,session=[],idx=0,picks=[],shown=false,paperPath='',cache=new Map(),mode='paper',view='home';
var state={records:{},wrong:{},favs:{},last:null};try{Object.assign(state,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('存储不足，请导出记录');}}
function E(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toast(s){var t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(function(){t.style.display='none';},2200);}
function pid(q){return q.qid||q.path+'@'+q.num;}
function encode(p){return p.split('/').map(encodeURIComponent).join('/');}
function srcURL(src,path){try{var u=new URL(src,'https://cdn.jsdelivr.net/gh/ERRRC/xingcezhenti@main/'+encode(path));return u.protocol==='https:'?u.href:'';}catch(e){return '';}}
function rich(source,path){var imgs=[];var s=String(source||'');function add(url){var tag='ZZIMG'+imgs.length+'ZZ',u=srcURL(url,path);imgs.push(u?'<img loading="lazy" src="'+E(u)+'" alt="题目插图">':'');return tag;}
s=s.replace(/<img\b[^>]*?\bsrc\s*=\s*["']([^"']+)["'][^>]*>/gi,function(a,p){return add(p);});
s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,function(a,b,p){return add(p);});
s=s.replace(/<\/?p\b[^>]*>/gi,'\n\n').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
s=E(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
s=s.split(/\n\s*\n/).map(function(x){return x.trim()?'<p>'+x.trim().replace(/\n/g,'<br>')+'</p>':'';}).join('');
imgs.forEach(function(img,i){s=s.replace(new RegExp('ZZIMG'+i+'ZZ','g'),img);});return s;}
function parse(md,path){var lines=md.replace(/^---\r?\n[\s\S]*?\r?\n---\s*/,'').split(/\r?\n/),res=[],material='',mat=[],collect=false,q=null;
function flush(){if(!q)return;var body=[],opts=[],exp=[],answer='',phase=0;q.lines.forEach(function(line){var a=line.match(/^\s*\*\*答案\*\*\s*[：:]\s*(.*)/);if(a){answer=a[1].trim();phase=2;return;}if(/^\s*\*\*(官方)?解析\*\*/.test(line)){phase=3;return;}if(/^---\s*$/.test(line))return;if(phase===3){exp.push(line);return;}if(phase===2)return;var m=line.match(/^\s*[-*]?\s*\*\*([A-H])\*\*\s*[.．、:：]\s*(.*)$/i)||line.match(/^\s*[-*]?\s*([A-H])[.．、]\s*(.*)$/i);if(m){opts.push({k:m[1].toUpperCase(),v:m[2].replace(/✅/g,'').trim(),ok:line.includes('✅')});phase=1;return;}if(phase===1&&line.trim()&&opts.length)opts[opts.length-1].v+='\n'+line;else if(phase===0)body.push(line);});if(!answer)answer=opts.filter(function(x){return x.ok;}).map(function(x){return x.k;}).join('');q.body=body.join('\n').trim();q.opts=opts;q.answer=answer;q.exp=exp.join('\n').trim();q.material=material;q.path=path;delete q.lines;res.push(q);q=null;}
lines.forEach(function(line){if(/^##\s*材料\s*\d*/.test(line)){flush();mat=[];collect=true;return;}var m=line.match(/^#{2,3}\s*第\s*(\d+)\s*题(.*)$/);if(m){if(collect){material=mat.join('\n').trim();collect=false;}flush();var info=(m[2]||'').match(/qid\s+(\d+)\s*[·・]\s*([^<\n]+)/);q={num:Number(m[1]),qid:info?info[1]:null,tag:info?info[2].trim():'综合',lines:[]};return;}if(collect)mat.push(line);else if(q)q.lines.push(line);});flush();return res;}
async function load(path){if(cache.has(path))return cache.get(path);var urls=['https://cdn.jsdelivr.net/gh/ERRRC/xingcezhenti@main/'+encode(path),'https://raw.githubusercontent.com/ERRRC/xingcezhenti/main/'+encode(path)],err;for(var i=0;i<urls.length;i++){try{var r=await fetch(urls[i]);if(!r.ok)throw Error('HTTP '+r.status);var q=parse(await r.text(),path);if(!q.length)throw Error('未找到题目');cache.set(path,q);return q;}catch(e){err=e;}}throw err||Error('读取失败');}
function shell(title,subtitle){return '<div class="lead"><small>XINGCE · PRACTICE</small><h1>'+E(title)+'</h1><div class="muted">'+E(subtitle)+'</div></div>';}
function stats(){var r=Object.values(state.records),n=r.filter(function(x){return x.correct;}).length;return '<div class="stats"><div class="stat"><b>'+r.length+'</b><span>已作答</span></div><div class="stat"><b>'+(r.length?Math.round(n/r.length*100):0)+'%</b><span>历史正确率</span></div><div class="stat"><b>'+Object.keys(state.wrong).length+'</b><span>错题</span></div><div class="stat"><b>'+Object.keys(state.favs).length+'</b><span>收藏</span></div></div>';}
function setView(v){view=v;document.querySelectorAll('.nav').forEach(function(n){n.classList.toggle('active',n.dataset.view===v);});if(v==='home')home();else if(v==='study')study();else if(v==='records')records();else saved(v);}
function home(){var list=manifest.papers.filter(function(p){return p[0]===group&&(year==='全部'||p[1].includes(year))&&(!search||p[1].toLowerCase().includes(search.toLowerCase()));});app.innerHTML=shell('历年真题，分模块练习','选择年份与试卷后开始答题，答案仅在提交后显示。')+stats()+'<div class="card"><h2>① 选择题型模块</h2><div class="mods">'+MOD.map(function(m,i){return '<button class="mod '+(group===i?'active':'')+'" data-mod="'+i+'"><b>'+E(m.slice(3))+'</b><small>约 '+COUNTS[i]+' 道题</small></button>';}).join('')+'</div><h2 style="margin-top:23px">② 选择年份及试卷</h2><div class="filters"><select id="year"><option value="全部">全部年份</option>'+Array.from({length:11},function(_,i){return String(2026-i);}).map(function(y){return '<option value="'+y+'" '+(year===y?'selected':'')+'>'+y+' 年</option>';}).join('')+'</select><input id="search" type="text" placeholder="搜索地区、国考或试卷名称" value="'+E(search)+'"></div><div class="row between" style="margin-top:15px"><span class="sub muted">找到 '+list.length+' 份试卷</span><label class="sub muted"><input type="checkbox" id="shuffle"> 试卷内随机顺序</label></div><div class="papers">'+(list.length?list.slice(0,limit).map(function(p){var path=MOD[p[0]]+'/'+p[1]+'.md';return '<div class="paper"><div><strong>'+E(p[1])+'</strong><span>'+E(MOD[p[0]].slice(3))+'</span></div><button class="btn" data-paper="'+E(path)+'">开始</button></div>';}).join(''):'<div class="empty">没有符合条件的试卷</div>')+'</div>'+(list.length>limit?'<button class="btn soft" id="more" style="margin-top:12px">加载更多试卷</button>':'')+'</div><p class="quiet">图片和试题从原仓库按需读取，需联网。学习记录默认只保存在本机，可在“学习记录”中导出或导入。</p>';
document.querySelectorAll('[data-mod]').forEach(function(n){n.onclick=function(){group=+n.dataset.mod;limit=70;home();};});document.getElementById('year').onchange=function(e){year=e.target.value;limit=70;home();};document.getElementById('search').oninput=function(e){search=e.target.value;limit=70;var p=e.target.selectionStart;home();var x=document.getElementById('search');x.focus();x.setSelectionRange(p,p);};document.querySelectorAll('[data-paper]').forEach(function(n){n.onclick=function(){start(n.dataset.paper,document.getElementById('shuffle').checked);};});var b=document.getElementById('more');if(b)b.onclick=function(){limit+=100;home();};}
async function start(path,shuffle){app.innerHTML='<div class="card">正在读取试卷……<p class="sub muted">'+E(path)+'</p></div>';try{session=(await load(path)).slice();if(shuffle){for(var i=session.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=session[i];session[i]=session[j];session[j]=t;}}idx=0;picks=[];shown=false;paperPath=path;mode='paper';state.last={path:path,idx:0};save();setView('study');}catch(e){app.innerHTML='<div class="card"><h2>试卷加载失败</h2><p>'+E(e.message)+'</p><button class="btn" id="back">返回题库</button></div>';document.getElementById('back').onclick=function(){setView('home');};}}
function letters(s){var a=String(s||'').match(/[A-H]/g);return a?Array.from(new Set(a)).sort().join(''):'';}
function study(){if(!session.length){setView('home');return;}var q=session[idx],key=pid(q),isFav=!!state.favs[key],answer=letters(q.answer),choice=picks.slice().sort().join(''),right=choice===answer;var options=q.opts.map(function(o){var chosen=picks.includes(o.k),cl=shown?(answer.includes(o.k)?' correct':chosen?' incorrect':''):chosen?' selected':'';return '<button class="opt'+cl+'" data-opt="'+o.k+'" '+(shown?'disabled':'')+'><span class="letter">'+o.k+'</span><span class="rich">'+rich(o.v,q.path)+'</span></button>';}).join('');app.innerHTML='<div class="row between" style="margin-bottom:12px"><button class="btn outline" id="back">← 返回题库</button><button class="btn outline" id="fav">'+(isFav?'★ 已收藏':'☆ 收藏本题')+'</button></div><div class="card"><div class="qtop"><span>'+E(q.path.split('/')[0].slice(3))+' · '+E(q.tag)+'</span><span>第 '+(idx+1)+' / '+session.length+' 题</span></div><div class="bar"><i style="width:'+((idx+1)/session.length*100)+'%"></i></div>'+(q.material?'<details class="material" open><summary>阅读材料（点击收起/展开）</summary><div class="rich">'+rich(q.material,q.path)+'</div></details>':'')+'<div class="stem rich">'+rich(q.body,q.path)+'</div>'+(options?'<div class="options">'+options+'</div>':'<p class="muted sub">本题无标准选项格式，请查看参考解析。</p>')+(shown?'<div class="answer"><h3>'+(!options?'参考答案':right?'✓ 回答正确':'✕ 回答错误')+' · '+E(q.answer||'未提供')+'</h3><div class="rich">'+(q.exp?rich(q.exp,q.path):'原题未提供解析')+'</div></div>':'<div class="row"><button class="btn" id="submit">'+(options?'提交答案':'查看答案')+'</button><span class="sub muted">多选题可连续选择</span></div>')+'<div class="row between end"><div class="row"><button class="btn outline" id="prev" '+(idx===0?'disabled':'')+'>上一题</button><button class="btn soft" id="next">'+(idx===session.length-1?'完成练习':'下一题 →')+'</button></div><span class="sub muted">qid '+E(q.qid||'未知')+'</span></div></div>';
document.getElementById('back').onclick=function(){setView('home');};document.getElementById('fav').onclick=function(){if(state.favs[key])delete state.favs[key];else state.favs[key]={path:q.path,num:q.num,body:q.body.slice(0,80)};save();study();};document.querySelectorAll('[data-opt]').forEach(function(b){b.onclick=function(){var k=b.dataset.opt;picks=picks.includes(k)?picks.filter(function(x){return x!==k;}):picks.concat(k);study();};});var submit=document.getElementById('submit');if(submit)submit.onclick=function(){if(options&&!picks.length){toast('先选择答案');return;}shown=true;var ok=choice===answer;if(!state.records[key])state.records[key]={correct:ok,path:q.path,body:q.body.slice(0,80),date:new Date().toLocaleDateString()};if(!ok&&options)state.wrong[key]={path:q.path,num:q.num,body:q.body.slice(0,80)};save();study();};document.getElementById('prev').onclick=function(){go(idx-1);};document.getElementById('next').onclick=function(){if(idx===session.length-1){app.innerHTML=shell('本份练习已结束','可以回题库继续学习，或复习错题。')+stats()+'<div class="card row"><button class="btn" id="h">返回题库</button><button class="btn soft" id="w">错题重做</button></div>';document.getElementById('h').onclick=function(){setView('home');};document.getElementById('w').onclick=function(){setView('wrong');};}else go(idx+1);};}
function go(n){if(n<0||n>=session.length)return;idx=n;picks=[];shown=false;if(mode==='paper'){state.last={path:paperPath,idx:idx};save();}study();window.scrollTo(0,0);}
function saved(which){var arr=Object.keys(which==='wrong'?state.wrong:state.favs).map(function(k){return Object.assign({id:k},which==='wrong'?state.wrong[k]:state.favs[k]);});app.innerHTML=shell(which==='wrong'?'错题重做':'我的收藏',which==='wrong'?'再次做题时不会显示上次选择的答案。':'收藏的题目可以重复练习。')+'<div class="card"><div class="row between"><h2>共 '+arr.length+' 题</h2>'+(arr.length?'<button class="btn outline" id="clear">清空此列表</button>':'')+'</div>'+(arr.length?arr.reverse().map(function(x){return '<div class="entry"><div><b>'+E(x.body||'第'+x.num+'题')+'</b><small>'+E(x.path)+'</small></div><button class="btn soft" data-review="'+E(x.id)+'">重做</button></div>';}).join(''):'<div class="empty">暂无题目，先开始练习。</div>')+'</div>';document.querySelectorAll('[data-review]').forEach(function(b){b.onclick=function(){review((which==='wrong'?state.wrong:state.favs)[b.dataset.review],b.dataset.review,which);};});var c=document.getElementById('clear');if(c)c.onclick=function(){if(confirm('确定清空当前列表吗？')){if(which==='wrong')state.wrong={};else state.favs={};save();saved(which);}};}
async function review(x,key,which){app.innerHTML='<div class="card">正在载入题目……</div>';try{var qs=await load(x.path),q=qs.find(function(v){return pid(v)===key||v.num===x.num;});if(!q)throw Error('未找到原题');session=[q];idx=0;picks=[];shown=false;mode='review';setView('study');}catch(e){app.innerHTML='<div class="card">'+E(e.message)+' <button class="btn" id="back">返回</button></div>';document.getElementById('back').onclick=function(){setView(which);};}}
function records(){app.innerHTML=shell('学习记录与进度管理','记录储存在当前浏览器，手机与电脑之间暂不自动同步。')+stats()+'<div class="card"><h2>导出 / 导入学习进度</h2><p class="muted sub">在手机上导出 JSON，再到电脑上导入，就能转移做题记录。导入会覆盖当前设备的记录。</p><div class="row"><button class="btn" id="export">导出学习进度</button><label class="btn soft filebtn">导入进度<input type="file" id="import" accept=".json,application/json"></label><button class="btn red" id="clear">清除全部记录</button></div></div><div class="card"><h2>原始题库</h2><p>本 App 按需读取 <a href="https://github.com/ERRRC/xingcezhenti" target="_blank" rel="noopener">ERRRC/xingcezhenti</a> 的公开试题及解析。个别图片或排版可能显示不完整。</p></div>';document.getElementById('export').onclick=function(){var blob=new Blob([JSON.stringify({version:1,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='行测研习-学习记录.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);};document.getElementById('import').onchange=async function(e){try{var f=e.target.files[0];if(!f)return;var j=JSON.parse(await f.text()),x=j.data||j;if(!x.records||!x.wrong||!x.favs)throw Error('文件格式错误');if(!confirm('确定覆盖当前设备的记录吗？'))return;state={records:x.records,wrong:x.wrong,favs:x.favs,last:x.last||null};save();records();toast('导入成功');}catch(err){toast('导入失败：'+err.message);}};document.getElementById('clear').onclick=function(){if(confirm('确定清除所有学习记录？不可恢复。')){state={records:{},wrong:{},favs:{},last:null};save();records();}};}
document.querySelectorAll('.nav').forEach(function(n){n.onclick=function(){setView(n.dataset.view);};});
(async function(){try{var r=await fetch('./manifest.json');if(!r.ok)throw Error('目录服务器返回 '+r.status);manifest=await r.json();if(!Array.isArray(manifest.papers))throw Error('目录格式错误');home();}catch(e){app.innerHTML=shell('目录加载失败','请检查网络、部署状态后刷新。')+'<div class="card"><p>'+E(e.message)+'</p><button class="btn" id="refresh">刷新页面</button></div>';document.getElementById('refresh').onclick=function(){location.reload();};}})();
})();
</script></body></html>
