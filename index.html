<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d5a">
<title>综合测试刷题站</title>
<style>
:root{
  --bg:#f4fbf6;--card:#ffffff;--ink:#183328;--muted:#6d8178;--line:#dbe9e0;
  --green:#2f7d5a;--green2:#e7f5ec;--green3:#cce9d8;--danger:#b64a4a;--warn:#9a6a13;
  --shadow:0 14px 34px rgba(33,83,59,.10);--radius:20px
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#edf8f1 0,#f8fcf9 34%,#f4fbf6 100%);color:var(--ink)}
button,select,input{font:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}
.brand h1{margin:0;font-size:28px;letter-spacing:.5px}
.brand p{margin:6px 0 0;color:var(--muted)}
.timerbox{background:#183d2e;color:#fff;padding:12px 16px;border-radius:16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;min-width:92px}
.grid{display:grid;grid-template-columns:300px 1fr;gap:18px}
.panel,.quiz{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:16px;align-self:start;position:sticky;top:14px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{padding:11px;border-radius:14px;background:var(--green2)}
.stat b{display:block;font-size:21px}
.stat span{font-size:12px;color:var(--muted)}
.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
label.small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
select,.textbtn{width:100%;border:1px solid var(--line);background:#fff;padding:10px 11px;border-radius:12px;color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.primary{border:0;background:var(--green);color:#fff;padding:11px 14px;border-radius:12px;font-weight:700}
.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 12px;border-radius:12px}
.ghost{border:0;background:transparent;color:inherit;padding:6px 8px}
.danger{color:var(--danger)}
.quiz{padding:22px;min-height:650px}
.qtop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;padding:6px 9px;border-radius:999px;background:var(--green2);color:#276847}
.badge.warn{background:#fff3d8;color:#845807}
.qnum{color:var(--muted);font-size:13px;text-align:right}
.stem{font-size:19px;line-height:1.75;font-weight:650;white-space:pre-wrap;margin:18px 0}
.options{display:grid;gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:#fff;transition:.15s}
.option:hover{border-color:#9cc9ad;background:#fbfffc}
.option.selected{border-color:var(--green);background:var(--green2)}
.option.correct{border-color:#3a9166;background:#e9f7ef}
.option.wrong{border-color:#cf7171;background:#fff0f0}
.key{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#eef4f0;font-weight:800;flex:0 0 30px}
.option input{display:none}
.explain{margin-top:16px;padding:15px;border-radius:15px;background:#f7faf8;border:1px solid var(--line);line-height:1.7}
.explain strong{color:var(--green)}
.source{margin-top:10px;color:var(--muted);font-size:12px}
.nav{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.nav button{min-height:42px}
.spacer{flex:1}
.progressline{height:8px;border-radius:999px;background:#e7eee9;overflow:hidden;margin:14px 0 8px}
.progressline i{display:block;height:100%;background:var(--green);width:0}
.micro{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:190px;overflow:auto;padding-right:2px}
.pal{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:12px}
.pal.done{background:#dff2e7;border-color:#a8d4b9}
.pal.wrong{background:#ffe1e1;border-color:#e6aaaa}
.pal.current{outline:2px solid var(--green)}
.empty{display:grid;place-items:center;min-height:440px;text-align:center;color:var(--muted)}
.saveNote{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#16382b;color:#fff;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,34,26,.45);display:none;place-items:center;padding:20px;z-index:10}
.modal.show{display:grid}.modalbox{width:min(560px,100%);background:#fff;border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.modalbox h3{margin-top:0}.modalbox textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:12px;padding:10px}
.kbd{font-size:11px;border:1px solid #cbd8d0;border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fff;color:#5a6e64}
@media(max-width:840px){
  .wrap{padding:12px}.top{align-items:flex-start}.brand h1{font-size:22px}.brand p{font-size:13px}
  .grid{grid-template-columns:1fr}.panel{position:static}.quiz{padding:16px;min-height:560px}
  .palette{grid-template-columns:repeat(10,1fr)}.stem{font-size:17px}
  .timerbox{padding:10px 12px}.timer{font-size:18px;min-width:78px}
}
@media(max-width:520px){
  .top{flex-direction:column}.timerbox{width:100%;justify-content:space-between}
  .palette{grid-template-columns:repeat(8,1fr)}.qtop{flex-direction:column}.qnum{text-align:left}
  .nav .spacer{display:none}.nav button{flex:1}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>🌿 综合测试刷题站</h1>
      <p>非数学 · 非形式逻辑｜自动保存进度｜错题回练｜计时训练</p>
    </div>
    <div class="timerbox">
      <span>⏱</span><span id="timer" class="timer">00:00:00</span>
      <button id="timerToggle" class="ghost">暂停</button>
      <button id="timerReset" class="ghost">重置</button>
    </div>
  </div>

  <div class="grid">
    <aside class="panel">
      <div class="statgrid">
        <div class="stat"><b id="statDone">0</b><span>已作答</span></div>
        <div class="stat"><b id="statAcc">—</b><span>正确率</span></div>
        <div class="stat"><b id="statWrong">0</b><span>错题</span></div>
        <div class="stat"><b id="statFav">0</b><span>收藏</span></div>
      </div>

      <div class="section">
        <label class="small">练习模式</label>
        <select id="mode">
          <option value="all">全部题目</option>
          <option value="unanswered">未做题</option>
          <option value="wrong">错题回练</option>
          <option value="favorite">收藏题</option>
          <option value="incomplete">原题不完整</option>
        </select>
        <label class="small" style="margin-top:10px">题型筛选</label>
        <select id="category"></select>
        <div class="row" style="margin-top:10px">
          <button id="shuffleBtn" class="secondary">🔀 随机顺序</button>
          <button id="resetOrderBtn" class="secondary">↕ 顺序刷题</button>
        </div>
      </div>

      <div class="section">
        <div class="progressline"><i id="progressbar"></i></div>
        <div class="micro"><span id="progressText">0 / 0</span><span id="saveTime">尚未作答</span></div>
      </div>

      <div class="section">
        <label class="small">题号导航</label>
        <div id="palette" class="palette"></div>
      </div>

      <div class="section">
        <button id="saveExit" class="primary" style="width:100%">💾 保存退出</button>
        <div class="row" style="margin-top:8px">
          <button id="exportBtn" class="secondary">导出存档</button>
          <button id="importBtn" class="secondary">导入存档</button>
        </div>
        <button id="clearBtn" class="secondary danger" style="width:100%;margin-top:8px">清空全部进度</button>
        <div class="saveNote">本机自动保存；导出存档可用于换设备备份。</div>
      </div>
    </aside>

    <main id="quiz" class="quiz"></main>
  </div>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="importFile" accept=".json" hidden>

const QUESTIONS = [{"id":1,"category":"字音字形","stem":"下列词语中，加点字的书写和注音完全正确的一项是（ ）。","options":[{"key":"A","text":"星宿（xiù） 赈灾（zhèng） 解剖（pōu） 悲怆（chuàng）"},{"key":"B","text":"忌讳（huì） 脑髓（suǐ） 酝酿（niàng） 漂悍（piāo）"},{"key":"C","text":"纨绔（kù） 磐石（pán） 恻隐（chè） 提防（dī）"},{"key":"D","text":"烙铁（lào） 亵渎（dú） 啮齿（niè） 御聘（pìn）"}],"answer":"D","explanation":"D项书写和读音均正确。A项“赈灾”的“赈”读zhèn；B项应为“剽悍”；C项“恻隐”的“恻”读cè。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":2,"category":"易错字","stem":"下列词语中，没有错别字的一项是（ ）。","options":[{"key":"A","text":"兴高彩烈 烟雾弥漫"},{"key":"B","text":"言简意赅 骇人听闻"},{"key":"C","text":"来势凶凶 天迸地裂"},{"key":"D","text":"歧视 绫辱 内含深邃"}],"answer":"B","explanation":"B项书写正确。A项“兴高彩烈”应为“兴高采烈”；C项“来势凶凶”应为“来势汹汹”，“天迸地裂”应为“天崩地裂”；D项“绫辱”应为“凌辱”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":3,"category":"易错字","stem":"下列各组词语中，书写完全正确的一项是（ ）。","options":[{"key":"A","text":"原野 气魄 赞歌 高山之颠"},{"key":"B","text":"狂澜 浊流 婉转 惊涛膨湃"},{"key":"C","text":"连环 奔腾 摇蓝 发扬滋长"},{"key":"D","text":"屏障 臂膀 哺育 一泻万丈"}],"answer":"D","explanation":"D项书写正确。A项“高山之颠”应为“高山之巅”；B项“惊涛膨湃”应为“惊涛澎湃”；C项“摇蓝”应为“摇篮”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":4,"category":"易错字","stem":"下列词语中，书写有误的一项是（ ）。","options":[{"key":"A","text":"汇合 燃烧 喷涌"},{"key":"B","text":"泛滥 惊醒 跳跃"},{"key":"C","text":"嗥鸣 孤仙 碧绿"},{"key":"D","text":"呼唤 皮鞭 土壤"}],"answer":"C","explanation":"C项“孤仙”应为“孤山”。其余各项书写正确。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":5,"category":"易错字","stem":"选出没有错别字的一项（ ）。","options":[{"key":"A","text":"瞳仁 晦暗 明析 谴责"},{"key":"B","text":"振撼 耳绊 辐射 悬涯"},{"key":"C","text":"恬静 颤栗 充沛 燥热"},{"key":"D","text":"束缚 凝聚 敲垂 锻炼"}],"answer":"C","explanation":"C项书写正确。A项“明析”应为“明晰”；B项应为“震撼、耳畔、悬崖”；D项“敲垂”应为“敲击”或依语境改为其他正确词语。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":6,"category":"易错字","stem":"下列词语中，没有别字的一组是（ ）。","options":[{"key":"A","text":"魁梧 无精打采 循序渐进"},{"key":"B","text":"防碍 抑扬顿挫 大事渲染"},{"key":"C","text":"停滞 狼狈不堪 相题并论"},{"key":"D","text":"贫瘠 敝帚自珍 杏无消息"}],"answer":"A","explanation":"A项书写正确。B项“防碍”应为“妨碍”；C项“相题并论”应为“相提并论”；D项“杏无消息”应为“杳无消息”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":7,"category":"易错字","stem":"下列词语中，没有错别字的一项是（ ）。","options":[{"key":"A","text":"更胜一筹 义愤填膺 销声匿迹 正襟危坐"},{"key":"B","text":"相形见绌 格守尽职 因地制宜 无精打采"},{"key":"C","text":"突如奇来 莫衷一是 语无伦次 迫不及待"},{"key":"D","text":"顾名思意 一筹莫展 怨天尤人 相辅相成"}],"answer":"A","explanation":"A项书写正确。B项“格守尽职”应为“恪守尽职”；C项“突如奇来”应为“突如其来”；D项“顾名思意”应为“顾名思义”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":8,"category":"字音","stem":"下列词语中，加点字的读音正确的一项是（ ）。","options":[{"key":"A","text":"自怨自艾（yì）"},{"key":"B","text":"刚愎自用（fù）"},{"key":"C","text":"暴殄天物（zhēn）"},{"key":"D","text":"刚正不阿（ā）"}],"answer":"A","explanation":"“自怨自艾”的“艾”在此读yì，意为改正。B项“愎”读bì；C项“殄”读tiǎn；D项“阿”读ē。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":9,"category":"词语辨析","stem":"“离开了世俗的纷扰，离开了利益的纷争，人的内心会逐渐归于清静。”句中“清静”使用不当，应改为（ ）。","options":[{"key":"A","text":"清净"},{"key":"B","text":"寂静"},{"key":"C","text":"安静"},{"key":"D","text":"幽静"}],"answer":"A","explanation":"“清净”可形容人的内心没有杂念或不受外界干扰；“清静”通常侧重环境安静。此处修饰“内心”，应改为“清净”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":10,"category":"语境填空","stem":"在下面一段话的空缺处依次填入词语，最恰当的一组是（ ）。国学经典数量众多，____，虽然是很多古人杰出智慧的成果，但也存在不合理、不科学的成分。正是这种____的状况，使得国学阅读尤其要注重甄别、择善而读。国学经典蕴含着丰富的知识与深刻的哲理，唯有____，才能慢慢领悟。","options":[{"key":"A","text":"凤毛麟角 良莠不一 融会贯通"},{"key":"B","text":"汗牛充栋 良莠不一 囫囵吞枣"},{"key":"C","text":"汗牛充栋 参差不齐 细嚼慢咽"},{"key":"D","text":"浩如烟海 参差不齐 浅尝辄止"}],"answer":"C","explanation":"“汗牛充栋”形容书籍很多；“参差不齐”可形容内容水平不一；“细嚼慢咽”比喻慢慢体会。三者与语境均吻合。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":11,"category":"成语辨析","stem":"古人有“闻过则喜”之说，而今天有些人则不然，总是____，对比之下，实在天差地别。填入横线最恰当的一项是（ ）。","options":[{"key":"A","text":"瑕不掩瑜"},{"key":"B","text":"讳疾忌医"},{"key":"C","text":"刚愎自用"},{"key":"D","text":"好大喜功"}],"answer":"B","explanation":"“讳疾忌医”比喻怕人批评而掩饰自己的缺点和错误，与“闻过则喜”形成直接对比。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":12,"category":"语境填空","stem":"报刊、广播、电视和网络等媒介为公众提供了表达渠道，普通人也能成为主动的发声者，既可以____，也可能传播不实之词、____，直接影响社会和谐。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"各抒己见 捕风捉影"},{"key":"B","text":"慷慨陈词 集思广益"},{"key":"C","text":"集思广益 风言风语"},{"key":"D","text":"畅所欲言 博采众长"}],"answer":"A","explanation":"“各抒己见”符合公众表达意见的语境；“捕风捉影”比喻说话做事毫无根据，与“不实之词”衔接恰当。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":13,"category":"语境填空","stem":"城市并不是一个____的系统，它要进行资源输入、废物排出以及内部运转。所有生态流都可以定量计算。城市设计必须根据周围的生态承载力确定城市规模，与生态环境形成良好的____关系。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"循环 支持"},{"key":"B","text":"封闭 匹配"},{"key":"C","text":"机械 符合"},{"key":"D","text":"动态 平衡"}],"answer":"D","explanation":"城市处于持续变化和交换之中，应用“动态”；城市规模与生态承载力之间应形成“平衡”关系。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":14,"category":"成语辨析","stem":"下面成语中，意思比较接近的一组是（ ）。","options":[{"key":"A","text":"顺水推舟—顺藤摸瓜"},{"key":"B","text":"桃李不言—瓜田李下"},{"key":"C","text":"三人成虎—众口铄金"},{"key":"D","text":"一蹴而就—一劳永逸"}],"answer":"C","explanation":"“三人成虎”和“众口铄金”都强调流言或众人的言论反复传播会造成强大影响。其余各组含义差异较大。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":15,"category":"词语辨析","stem":"大学生活即将结束，老师的____给我留下了深刻的印象。填入横线最恰当的一项是（ ）。","options":[{"key":"A","text":"告诉"},{"key":"B","text":"告诫"},{"key":"C","text":"劝诫"},{"key":"D","text":"忠告"}],"answer":"D","explanation":"“忠告”指诚恳地劝告，也可作名词，能够自然充当句子的主语。“告诉”通常作动词；“告诫、劝诫”在此搭配不如“忠告”自然。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":16,"category":"关联词","stem":"依次填入下列句中横线处的关联词，最恰当的一项是（ ）。①上千吨的轮船碰上这样大的风浪也得上下颠簸，____这么一条小船。②挖这样的井，占地多，不合算，____井的四周都是沙土，很容易塌陷。③改革后，产品质量提高了，款式新颖了，____更加受到群众欢迎。","options":[{"key":"A","text":"何况 而且 因而"},{"key":"B","text":"况且 何况 而且"},{"key":"C","text":"何况 因而 而且"},{"key":"D","text":"而且 何况 因而"}],"answer":"A","explanation":"①由大轮船推及小船，用“何况”；②补充另一个不利条件，用“而且”；③前因后果，用“因而”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":17,"category":"词语辨析","stem":"交流是复杂的艺术。有声语言不是表达意义的唯一方式，形体语言同样重要。各民族间的形体语言有的形式和意义相同，有的虽然形式相同，意义却____。填入横线最恰当的一项是（ ）。","options":[{"key":"A","text":"南辕北辙"},{"key":"B","text":"针锋相对"},{"key":"C","text":"背道而驰"},{"key":"D","text":"截然相反"}],"answer":"D","explanation":"这里比较的是同一形式在不同文化中的意义完全不同，“截然相反”最准确。“南辕北辙、背道而驰”多形容行动与目的相反，“针锋相对”多形容双方观点或行动对立。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":18,"category":"词语辨析","stem":"在下列各句横线处依次填入词语，正确的一组是（ ）。①误会产生之后，人们并没有给他____的机会。②这两个问题之间没有什么关联，应当____处理。③大家的力量____在一起，就没有克服不了的困难。","options":[{"key":"A","text":"分辩 各别 会合"},{"key":"B","text":"分辩 分别 汇合"},{"key":"C","text":"分辨 各别 会合"},{"key":"D","text":"分辨 分别 汇合"}],"answer":"B","explanation":"“分辩”指辩白；“分别”指按不同情况处理；“汇合”指聚集到一起。三处依次选“分辩、分别、汇合”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":19,"category":"虚词辨析","stem":"查韦斯认为，新自由主义发展的模式不适合拉美国家。他试图建立一种以人为中心、结合市场机制和国家调节作用的社会发展道路。这种道路____“不现实”的共产主义，____“野蛮”的资本主义，____一种有合理市场竞争的社会主义；____要适当加入全球化，____要确保自己的民族特性。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"既是 又是 还是 而且 但是"},{"key":"B","text":"既不是 也不是 而是 而且 还"},{"key":"C","text":"不是 就是 而是 虽然 但是"},{"key":"D","text":"既是 也是 不是 虽然 但是"}],"answer":"B","explanation":"前两空并列否定，第三空转入肯定，应用“既不是……也不是……而是……”；后两层语意递进，用“而且……还……”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":20,"category":"实词辨析","stem":"“你怎么啦？”这句话在不同语境中可以表示____、____、____、____等不同情绪。离开语境，就不能真正理解语言的意义。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"怀疑 焦急 紧张 激动"},{"key":"B","text":"担心 沮丧 询问 痛苦"},{"key":"C","text":"不解 惊奇 关切 责备"},{"key":"D","text":"惊惶 喜悦 询问 关切"}],"answer":"C","explanation":"同一句话可随语境表达疑惑、惊讶、关心或责备。C项四个词都能与“你怎么啦”形成自然语境。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":21,"category":"成语辨析","stem":"定义的使命是抽象、概括某类事物的本质特征。定义应当根据实践不断修正，而有人却常常“开除”那些概括不了的同类事物，以维护定义的纯洁性，这无疑是（ ）。","options":[{"key":"A","text":"指鹿为马"},{"key":"B","text":"掩耳盗铃"},{"key":"C","text":"本末倒置"},{"key":"D","text":"削足适履"}],"answer":"D","explanation":"“削足适履”比喻不合理地迁就现成条件，或生搬硬套。为了维护定义而排除真实事物，正是让事实迁就定义。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":22,"category":"语境填空","stem":"敦煌壁画共有五万多平方米，若按一米高排列，有五十多公里长；若要____地浏览一遍，即使每幅只停留一秒，也要夜以继日。敦煌壁画的价值不只在数量之巨，更在其内涵的____。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"浮光掠影 异彩纷呈"},{"key":"B","text":"一目十行 源远流长"},{"key":"C","text":"细致入微 独树一帜"},{"key":"D","text":"走马观花 博大精深"}],"answer":"D","explanation":"“每幅只停留一秒”对应粗略浏览的“走马观花”；形容文化内涵丰富深厚，应用“博大精深”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":23,"category":"语境填空","stem":"作为公司领导，不需要也不可能事必躬亲，但一定要____，能够从细节中发现问题；在工作安排上要____，使团队形成执行力；面对推诿时不能一味____。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"明察秋毫 周密 搪塞"},{"key":"B","text":"明辨是非 周详 推脱"},{"key":"C","text":"抓大放小 透彻 塞责"},{"key":"D","text":"高瞻远瞩 严密 敷衍"}],"answer":"A","explanation":"“明察秋毫”强调观察细微；“周密”可形容工作安排；“搪塞”指敷衍应付。三者与语境衔接最自然。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":24,"category":"词语辨析","stem":"该地区对环境保护采取了强有力的措施，使水土流失现象得到____，生态环境向良性循环转变。填入横线最恰当的一项是（ ）。","options":[{"key":"A","text":"制止"},{"key":"B","text":"遏制"},{"key":"C","text":"截止"},{"key":"D","text":"终止"}],"answer":"B","explanation":"“遏制”指控制、阻止某种趋势继续发展，常与“现象、势头”搭配。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":25,"category":"病句辨析","stem":"下列各句中，没有语病的一项是（ ）。","options":[{"key":"A","text":"孟非是近年来深受观众喜爱的电视节目主持人，他常常妙语连珠，拥有广泛的支持者，有很高的收视率。"},{"key":"B","text":"为了提高同学们的语文素养，我校团委积极开展“读经典作品，建书香校园”。"},{"key":"C","text":"盛夏，龙虾成了食客们的首选。请记住，吃龙虾切忌同时服用维生素C。"},{"key":"D","text":"“五四”的火炬传到了当代青年的手中，如何点燃和照亮自己的青春，是每个当代青年都要思考和面对的问题。"}],"answer":"C","explanation":"C项表意完整。A项“主持人”与“有很高的收视率”搭配不当；B项缺少“活动”作“开展”的宾语；D项“点燃青春”搭配不当，且“思考和面对问题”语序不当。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":26,"category":"病句辨析","stem":"下列各句中，没有语病的一句是（ ）。","options":[{"key":"A","text":"听了校长的报告，使我受到了极大的鼓舞。"},{"key":"B","text":"她做了两个丈夫喜欢的菜。"},{"key":"C","text":"敦煌艺术宝库的保存，使我们有可能了解一千五六百年来中国艺术成长发展的情况。"},{"key":"D","text":"在这次高交会上，各公司对网络信息交换了广泛的意见。"}],"answer":"C","explanation":"C项结构完整、搭配恰当。A项滥用介词导致主语残缺；B项有歧义；D项语序和搭配不当，应改为“各公司就网络信息交换问题广泛交换了意见”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":27,"category":"病句辨析","stem":"下列各句中，没有语病的一项是（ ）。","options":[{"key":"A","text":"这篇作文真难写，我用了整整两个小时左右的时间，才写好交卷。"},{"key":"B","text":"我们应当认真解决和研究同学们提出的问题。"},{"key":"C","text":"张老师的一席话把我先前的顾虑全赶跑了。"},{"key":"D","text":"几个学校的中层干部就近期的德育工作发表了很好的意见。"}],"answer":"C","explanation":"C项表达通顺。A项“整整”与“左右”矛盾；B项应先“研究”再“解决”；D项“几个学校的中层干部”存在范围歧义。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":28,"category":"病句辨析","stem":"下列各句中，没有语病的一项是（ ）。","options":[{"key":"A","text":"营造健康文明的网络文化环境，清除不健康信息已成为新时期精神文明建设的迫切需要。"},{"key":"B","text":"在阅读文学名著的过程中，常常能够使我们明白许多做人的道理，悟出人生的真谛。"},{"key":"C","text":"会不会用心观察，能不能重视积累，是提高写作水平的基础。"},{"key":"D","text":"他上课认真听讲，下课一有工夫不是看语文、数学等书，就是看报纸，全班同学没有一个不说他学习不积极。"}],"answer":"A","explanation":"A项正确。B项滥用“在……过程中”和“使”导致主语残缺；C项两面对一面；D项“没有一个不说他学习不积极”与本意相反。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":29,"category":"病句辨析","stem":"下列各句中，没有语病的一项是（ ）。","options":[{"key":"A","text":"北京市将在大力发展首都经济、促进国民经济持续快速健康发展和社会全面进步的基础上，继续围绕广大人民群众普遍关心和反映强烈的问题办一批实事。"},{"key":"B","text":"秦山核电站每年的发电量，除了供本地使用外，还向上海、南京等地输送。"},{"key":"C","text":"尽管设计师们精心打造，将呈现出各种各样的几何构思，但建筑官员和建筑行家们更想了解公众更喜欢哪一种设计。"},{"key":"D","text":"今年春节期间，这个市的2100辆警车、3000多名民警、武警放弃休假，始终坚守在自己的岗位上。"}],"answer":"A","explanation":"A项结构和搭配正确。B项“发电量”不能“输送”，应改为“电力”；C项前一分句缺少主语；D项“警车”不能“放弃休假、坚守岗位”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":30,"category":"病句辨析","stem":"下列各句中，没有语病的一句是（ ）。","options":[{"key":"A","text":"终身教育制度的建立，不仅为那些因各种原因未能完成学业的人打开了一扇大门，也为那些对知识有着更高需求的人提供了机会。"},{"key":"B","text":"报告团成员结合亲身的经历，深情地讲述了罗阳同志生前刻苦攻关的事迹，感人肺腑，催人泪下，深深打动了现场的听众。"},{"key":"C","text":"“蛟龙”号潜海成功，对于完善我国海洋科学研究和海洋装备制造业发展，提升我国开发海洋的能力，将产生重大而深远的影响。"},{"key":"D","text":"长期以来我国为钓鱼岛及其周边海域提供天气预报服务，为渔民生产、海上搜救提供了气象保障服务。"}],"answer":"A","explanation":"A项正确。B项“事迹”后连续使用“感人肺腑、催人泪下、打动听众”造成结构杂糅；C项“完善……发展”搭配不当；D项“提供……提供服务”表意重复。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":31,"category":"病句辨析","stem":"从下列句子中选出没有语病的一句（ ）。","options":[{"key":"A","text":"阅读理解与否，是衡量阅读能力好坏的重要标志。"},{"key":"B","text":"阅读与理解，是衡量阅读能力好坏的重要标志。"},{"key":"C","text":"阅读是否理解，是衡量阅读能力的重要标志。"},{"key":"D","text":"阅读能力好坏的标志是理解。"}],"answer":"A","explanation":"A项“理解与否”与“能力好坏”前后照应。B、D项表意不完整；C项两面对一面。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":32,"category":"病句类型","stem":"“今天，在纪念毛泽东同志‘向雷锋同志学习’题词发表周年之际，推荐广大青年读一读《雷锋日记》这本好书。”这句话的主要语病是（ ）。","options":[{"key":"A","text":"成分残缺"},{"key":"B","text":"主谓搭配不当"},{"key":"C","text":"虚词误用"},{"key":"D","text":"比喻不当"}],"answer":"A","explanation":"介词结构“在……之际”不能充当主语，后面的“推荐”缺少施事主语。可在“推荐”前补上“我们”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":33,"category":"病句修改","stem":"原句：“不断改善并切实保障民生，才能真正保持社会的和谐与稳定，进一步提高国民的幸福指数，实现长治久安的目标。”下列修改最恰当的一项是（ ）。","options":[{"key":"A","text":"切实保障并不断改善民生，进一步提高国民的幸福指数，才能真正保持社会的和谐与稳定，实现长治久安的目标。"},{"key":"B","text":"不断改善并切实保障民生，才能进一步保持社会和谐，真正提高稳定指数。"},{"key":"C","text":"切实保障民生并改善，才能保持和提高社会和谐与国民幸福。"},{"key":"D","text":"不断保障并切实改善民生，实现社会稳定以后提高国民幸福指数。"}],"answer":"A","explanation":"应先“保障”再“改善”民生；“提高幸福指数”是保持社会和谐稳定的条件之一，应置于“才能”之前。A项语序和搭配均恰当。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":34,"category":"歧义辨析","stem":"下面四句话中，有歧义的一句是（ ）。","options":[{"key":"A","text":"各地根据实际情况，把几大块内容组合在一起。"},{"key":"B","text":"据报道，今年许多应届大学毕业生参加了研究生入学考试。"},{"key":"C","text":"满面春风的关大爷的儿子，兴冲冲地走了进来。"},{"key":"D","text":"接受教育是每个公民的权利，也是每个公民的义务。"}],"answer":"C","explanation":"“满面春风”既可能修饰“关大爷”，也可能修饰“关大爷的儿子”，修饰对象不明确。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":35,"category":"歧义辨析","stem":"下列句子中，有歧义的一句是（ ）。","options":[{"key":"A","text":"接受教育是每个公民的权利，也是每个公民的义务。"},{"key":"B","text":"本市火车站的客流量，平均每天都在5万人以上。"},{"key":"C","text":"解放军指战员日夜奋战，终于筑好了防洪大坝。"},{"key":"D","text":"小兰哭了很久，终于感到累了，便趴在桌子上睡着了。"}],"answer":"B","explanation":"“平均每天都在5万人以上”可理解为平均数超过5万人，也可理解为每天的数量都超过5万人，统计口径含混。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":36,"category":"歧义辨析","stem":"下面四句话中，有歧义的一句是（ ）。","options":[{"key":"A","text":"夜晚的天空总使人看不厌。"},{"key":"B","text":"她从书架上取下那本书递给我。"},{"key":"C","text":"今年全县粮食总产量超过历史最高水平两万吨。"},{"key":"D","text":"那是一条农民自发修筑的路。"}],"answer":"C","explanation":"“超过历史最高水平两万吨”既可理解为“比历史最高水平多两万吨”，也可被误解为“历史最高水平是两万吨”。应改为“比历史最高水平多两万吨”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":37,"category":"语句排序","stem":"将下列句子重新排列，语序正确的一项是（ ）。①地理环境的各个要素不是孤立存在和发展的。②每个要素的发展变化都会影响整个地理环境。③地理环境各要素之间存在相互配合、相互影响、相互渗透、相互制约的依存关系。④一个环节紧扣另一个环节，一个过程向另一个过程转化。⑤并直接或间接地影响人类的生存和发展。⑥最后必然导致整个地理环境由量变发展到质变。","options":[{"key":"A","text":"①③②④⑤⑥"},{"key":"B","text":"③①②⑥⑤④"},{"key":"C","text":"③①②④⑤⑥"},{"key":"D","text":"①②④⑥⑤③"}],"answer":"A","explanation":"①先提出总观点；③解释各要素的依存关系；②承接说明要素变化的影响；④、⑤写影响传导过程；⑥以结果收束。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":38,"category":"语言理解","stem":"海明威的作品表现人在困境中不可被打败的尊严，福克纳则提醒人们记住勇气、荣誉、希望、同情、怜悯和牺牲精神。人在遭受苦难、陷入迷惘时，只有具有这种精神力量的作家，才能给人们以鼓舞。下列理解正确的一项是（ ）。","options":[{"key":"A","text":"两位作家的作品都集中展现人在苦难面前的迷惘。"},{"key":"B","text":"两位作家的作品都只表达了乐观主义主题。"},{"key":"C","text":"两位作家都过分夸大了人的精神力量。"},{"key":"D","text":"两位作家都强调文学作品应当振奋人心、给人以精神力量。"}],"answer":"D","explanation":"文段共同强调文学在苦难中给予人勇气和精神支撑。D项概括准确；A、B缩小或偏离文意，C属于无依据评价。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":39,"category":"语言理解","stem":"我国科普工作虽有进步，但科普读物的数量和质量与发达国家仍有差距。在一些社会关注的重大问题上，科学家更应主动站出来，把科学语言转化为公众听得懂的语言，实事求是地讲真话。否则，真相缺失、谣言扩散，可能引起公众恐慌和困惑。文段意在强调（ ）。","options":[{"key":"A","text":"科普读物都应当通俗化。"},{"key":"B","text":"我国科普读物数量少、质量差。"},{"key":"C","text":"科学家应主动承担科普责任，求真务实地发声。"},{"key":"D","text":"公众应提高辨别谣言的能力。"}],"answer":"C","explanation":"文段先交代背景，随后以“科学家更应该”提出中心观点，末句说明不发声的后果。C项最全面。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":40,"category":"语言理解","stem":"近年来，家委会成为许多学校的标配，发挥着促进家校沟通的作用，但也出现家长拼背景、比资源、违规收费等问题。这些问题背离了家委会设置的初衷，也在一定程度上加剧了教育不公平。文段意在强调（ ）。","options":[{"key":"A","text":"应当给家委会正名"},{"key":"B","text":"家委会不是学校的标配"},{"key":"C","text":"家委会应回归角色本位"},{"key":"D","text":"家委会应完全退出学校管理"}],"answer":"C","explanation":"文段肯定家委会的沟通作用，同时指出其偏离初衷的问题，落点是使其回归应有职能。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":41,"category":"语言理解","stem":"在生产力不发达的时代，战争是争夺资源的重要方式。青年是战争中最重要的参与者，要赢得战争，青年必须具有强健体魄；人口越多，青年比重越高，城邦越能在竞争中居于优势。文段强调的是（ ）。","options":[{"key":"A","text":"青年在城邦竞争中起着重要作用"},{"key":"B","text":"获取资源只能依靠战争"},{"key":"C","text":"人口多寡是衡量城市发展的唯一指标"},{"key":"D","text":"竞争主要依赖人的身体素质"}],"answer":"A","explanation":"文段围绕青年作为战争参与者及其对城邦竞争力的影响展开。B、C、D都把文意绝对化或片面化。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":42,"category":"语言理解","stem":"对微生物进行科学研究时，显微镜只适合观察；如果进行生化分析，琼脂更重要。细菌可在琼脂表面形成肉眼可见的菌群，琼脂的半固态性质能固定细菌位置，从而便于克隆、培养并进行生化分析。这段文字主要说明（ ）。","options":[{"key":"A","text":"显微镜在微生物研究中的作用有限"},{"key":"B","text":"琼脂在微生物生化分析中发挥重要作用"},{"key":"C","text":"克隆技术使所有生化分析都更容易"},{"key":"D","text":"微生物实验室最常用的工具是显微镜"}],"answer":"B","explanation":"文段通过对比显微镜和琼脂，重点解释琼脂如何帮助培养细菌并服务于生化分析，B项最准确。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":43,"category":"语言理解","stem":"19世纪以前，人类速度的提升主要依赖火车和轮船，仍受机械运动范围限制。电气设备出现后，信息传递不再受原有空间限制，空间和时间的关系发生了决定性改变。文段意在说明（ ）。","options":[{"key":"A","text":"电气设备的诞生是近代科技革命的唯一标志"},{"key":"B","text":"科学技术的发展常常难以理解"},{"key":"C","text":"新型交通工具改变了人们的生活方式"},{"key":"D","text":"电给人类交流速度带来了根本性改变"}],"answer":"D","explanation":"转折后的“由于电的发现”是中心，强调电对空间、时间关系和交流速度的根本改变。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":44,"category":"语言理解","stem":"中小成本电影近年脱颖而出，但其辉煌并非完全是自身自然发展的结果。国产商业大片长期沿袭以华丽阵容、恢弘气势和视觉冲击为主的模式，观众逐渐产生审美疲劳，因而需要质朴、清新、接地气的中小成本电影作为“差异化补偿”。文段意在说明（ ）。","options":[{"key":"A","text":"中小成本电影发展潜力无限"},{"key":"B","text":"中小成本电影脱颖而出并非全是自身之功"},{"key":"C","text":"国产商业大片已经没有观众"},{"key":"D","text":"中小成本电影已经成为市场唯一主流"}],"answer":"B","explanation":"首句提出观点，后文说明商业大片造成的审美疲劳为中小成本电影提供了外部机会。B项与中心一致。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":45,"category":"语言理解","stem":"现代社会中，很多人虽重视健康，却仍沿用陈旧的健康观念，忽视“亚健康”是从健康向疾病转变的危险阶段。等疾病发生后再治疗，往往为时已晚。文段的中心观点是（ ）。","options":[{"key":"A","text":"应抽出时间调理，杜绝一切危险"},{"key":"B","text":"亚健康一定会发展成疾病"},{"key":"C","text":"应更新健康观念，重视预防和亚健康管理"},{"key":"D","text":"只要提高体检频率就能防患未然"}],"answer":"C","explanation":"文段批评“生病后再治疗”的陈旧观念，强调关注亚健康和预防。A、B、D均表述绝对或片面。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":46,"category":"语言理解","stem":"软科学的研究对象涉及经济、管理、社会等复杂领域。随着社会系统日益复杂，决策对综合知识和系统分析的需求不断增加，软科学将在广泛领域发挥越来越重要的作用。文段主要强调（ ）。","options":[{"key":"A","text":"人们对软科学的认识不断提高"},{"key":"B","text":"软科学当前发展速度非常快"},{"key":"C","text":"软科学发展的原因和前景"},{"key":"D","text":"人们重视软科学的单一原因"}],"answer":"C","explanation":"文段既说明社会复杂化和决策需求是软科学发展的原因，也指出其未来作用，C项概括最全面。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":47,"category":"语言理解","stem":"大学研究固然应为经济发展作出贡献，大学教育也应帮助学生从事有益而令人满意的工作。然而，最好的教育还有无法用金钱衡量的方面：它使人更有创造性、更善于深思熟虑，更有理想和洞察力。对“最好的教育”理解最恰当的一项是（ ）。","options":[{"key":"A","text":"只为经济发展服务的教育"},{"key":"B","text":"只帮助学生获得工作的教育"},{"key":"C","text":"只重视专业技能的教育"},{"key":"D","text":"兼顾职业能力与人的完整发展的教育"}],"answer":"D","explanation":"文段先承认经济和职业功能，随后用“然而”强调人格、思考和创造力的发展，因此应理解为二者兼顾。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":48,"category":"语境填空","stem":"一个拥有工匠精神的国家和民族，必然会少一些浮躁，多一些纯粹；少一些投机取巧，多一些____；少一些____，多一些专注持久；少一些____，多一些优品精品。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"实事求是 好高骛远 偷工减料"},{"key":"B","text":"兢兢业业 口是心非 花里胡哨"},{"key":"C","text":"稳扎稳打 杀鸡取卵 敷衍了事"},{"key":"D","text":"脚踏实地 急功近利 粗制滥造"}],"answer":"D","explanation":"三组都要求与后面的积极品质形成反向对照：“投机取巧—脚踏实地”“急功近利—专注持久”“粗制滥造—优品精品”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":49,"category":"文化常识","stem":"《资治通鉴》书名的含义是（ ）。","options":[{"key":"A","text":"鉴于往事，有资于治道"},{"key":"B","text":"记录天下奇闻，以供娱乐"},{"key":"C","text":"汇集历代诗文，以资鉴赏"},{"key":"D","text":"研究兵法谋略，以助征战"}],"answer":"A","explanation":"“资治”意为帮助治理，“通鉴”意为贯通古今、作为借鉴。书名通常解释为“鉴于往事，有资于治道”。","source":"四份资料汇总；与新增题重复者已合并","incomplete":false},{"id":50,"category":"法律常识","stem":"有关规定要求其他车辆对使用特种音响警报器和红色回转警灯的特种车辆予以避让。这主要体现了行政职权的（ ）。","options":[{"key":"A","text":"优益性"},{"key":"B","text":"单方性"},{"key":"C","text":"强制性"},{"key":"D","text":"执行性"}],"answer":"A","explanation":"行政优益权是国家为保障行政主体有效行使职权而赋予的职务优先条件。特种车辆执行公务时享有道路优先，体现行政职权的优益性。","source":"《2025年1月止综合测试真题》第1页；《2026(1 综合测试）》第160、162页","incomplete":false},{"id":51,"category":"语言文字法规","stem":"下列情形中，可以依法保留或使用繁体字、异体字的是（ ）。","options":[{"key":"A","text":"姓氏中的异体字"},{"key":"B","text":"机关公文"},{"key":"C","text":"企业名称的普通用字"},{"key":"D","text":"面向社会的广告用字"}],"answer":"A","explanation":"国家通用语言文字法允许姓氏中的异体字等法定特殊情形保留使用；机关公文、企业普通名称和广告原则上应使用规范汉字。","source":"《2025年1月止综合测试真题》第1页","incomplete":false},{"id":52,"category":"科学常识","stem":"在一个与外界没有热交换的密闭房间内打开冰箱门，并让冰箱持续正常工作。一段时间后，房间内的平均温度将（ ）。","options":[{"key":"A","text":"升高"},{"key":"B","text":"降低"},{"key":"C","text":"不变"},{"key":"D","text":"先降低后保持不变"}],"answer":"A","explanation":"冰箱把箱内热量转移到室内，同时压缩机消耗的电能最终也转化为热量。房间总体得到额外热量，因此平均温度升高。","source":"《2025年1月止综合测试真题》第1页；《2026(1 综合测试）》第105、160页","incomplete":false},{"id":53,"category":"哲学常识","stem":"“众人皆知利利而病病也，唯圣人知病之为利，利之为病也。”这句话主要说明利与弊之间存在（ ）。","options":[{"key":"A","text":"绝对同一关系"},{"key":"B","text":"在一定条件下相互转化的关系"},{"key":"C","text":"彼此排斥、永不联系的关系"},{"key":"D","text":"由主观意志任意决定的关系"}],"answer":"B","explanation":"材料指出利可能成为害、害也可能转化为利，强调矛盾双方在一定条件下可以相互转化。","source":"《2025年1月止综合测试真题》第1页","incomplete":false},{"id":54,"category":"科学常识","stem":"生态系统不断与外界进行物质、能量和信息交换，因此生态系统是一个（ ）。","options":[{"key":"A","text":"完全封闭的系统"},{"key":"B","text":"开放的系统"},{"key":"C","text":"静止不变的系统"},{"key":"D","text":"与环境无关的系统"}],"answer":"B","explanation":"能够同外界持续进行物质、能量和信息交换的系统属于开放系统。","source":"《2025年1月止综合测试真题》第1页","incomplete":false},{"id":55,"category":"教育学","stem":"推进义务教育改革和发展的战略性任务是（ ）。","options":[{"key":"A","text":"扩大考试规模"},{"key":"B","text":"均衡发展"},{"key":"C","text":"延长在校时间"},{"key":"D","text":"取消学校差异"}],"answer":"B","explanation":"义务教育的战略性任务是推进均衡发展，重点是合理配置资源、缩小区域和校际差距。","source":"《2025年1月止综合测试真题》第4页","incomplete":false},{"id":56,"category":"教育法规","stem":"义务教育阶段学生因故不能按期入学，按资料所示一般请假不得超过（ ）。","options":[{"key":"A","text":"一周"},{"key":"B","text":"两周"},{"key":"C","text":"一个月"},{"key":"D","text":"一学期"}],"answer":"B","explanation":"资料给出的办理规则是一般请假不超过两周；超过规定期限通常需要按休学等程序另行办理。","source":"《2025年1月止综合测试真题》第4页","incomplete":false},{"id":57,"category":"教育学","stem":"原始社会教育的突出特点是（ ）。","options":[{"key":"A","text":"具有鲜明的阶级性"},{"key":"B","text":"形成了完备的学校制度"},{"key":"C","text":"教育没有阶级性"},{"key":"D","text":"教育与生产劳动完全分离"}],"answer":"C","explanation":"原始社会尚未形成阶级和专门学校，教育没有阶级性，并与生产劳动和社会生活紧密结合。","source":"《2025年1月止综合测试真题》第4页","incomplete":false},{"id":58,"category":"教育学","stem":"狭义的教育通常指（ ）。","options":[{"key":"A","text":"家庭教育"},{"key":"B","text":"学校教育"},{"key":"C","text":"社会教育"},{"key":"D","text":"自我教育"}],"answer":"B","explanation":"狭义教育是有目的、有计划、有组织地影响受教育者的学校教育。","source":"《2025年1月止综合测试真题》第4页","incomplete":false},{"id":59,"category":"教育学","stem":"课外、校外教育与课堂教学的共同之处是二者都具有（ ）。","options":[{"key":"A","text":"自发性和随机性"},{"key":"B","text":"目的性、计划性和组织性"},{"key":"C","text":"强制性和封闭性"},{"key":"D","text":"娱乐性和随意性"}],"answer":"B","explanation":"二者都是学校教育体系中的有意识教育活动，均有明确目的，并按一定计划和组织实施。","source":"《2025年1月止综合测试真题》第4页","incomplete":false},{"id":60,"category":"教育研究","stem":"下列关于教育实验研究特点的表述，正确的一组是（ ）。","options":[{"key":"A","text":"可控制条件、检验假设并揭示变量关系"},{"key":"B","text":"只能自然观察，不能控制变量"},{"key":"C","text":"不需要研究假设，也不能重复验证"},{"key":"D","text":"只适合描述现象，不能解释因果"}],"answer":"A","explanation":"教育实验以假设为先导，通过控制条件考察变量关系，并可在一定条件下重复验证。","source":"《2025年1月止综合测试真题》第5页","incomplete":false},{"id":61,"category":"心理学","stem":"同时写字、听讲并注意课堂变化，主要体现了注意的（ ）。","options":[{"key":"A","text":"稳定性"},{"key":"B","text":"分配"},{"key":"C","text":"转移"},{"key":"D","text":"广度"}],"answer":"B","explanation":"注意的分配是人在同一时间内把注意指向两种或两种以上活动的能力，俗称“一心二用”。","source":"《2025年1月止综合测试真题》第5页","incomplete":false},{"id":62,"category":"教育学","stem":"教育活动必须遵循的两条基本规律是（ ）。","options":[{"key":"A","text":"教育与人口、教育与考试的关系"},{"key":"B","text":"教育与社会发展、教育与人的身心发展的关系"},{"key":"C","text":"教育与教材、教育与作业的关系"},{"key":"D","text":"教育与教师、教育与校舍的关系"}],"answer":"B","explanation":"教育一方面受社会政治、经济、文化等制约并反作用于社会，另一方面受人的身心发展规律制约并促进人的发展。","source":"《2025年1月止综合测试真题》第5页","incomplete":false},{"id":63,"category":"教育研究","stem":"教育调查常用的方法包括（ ）。","options":[{"key":"A","text":"观察、测验、问卷、查阅资料和谈话"},{"key":"B","text":"只做实验，不接触被调查者"},{"key":"C","text":"只查阅统计年鉴"},{"key":"D","text":"只使用课堂测验"}],"answer":"A","explanation":"教育调查可综合采用观察、测验、问卷、文献资料和访谈等方法收集信息。","source":"《2025年1月止综合测试真题》第5页","incomplete":false},{"id":64,"category":"教育研究","stem":"与实验法相比，调查法较突出的优势是（ ）。","options":[{"key":"A","text":"能够完全控制变量"},{"key":"B","text":"适用范围较广、实施较灵活"},{"key":"C","text":"一定能证明因果关系"},{"key":"D","text":"不需要样本和资料"}],"answer":"B","explanation":"调查法便于在较大范围内收集现实资料，具有实用性和广泛性；但对变量控制和因果推断通常弱于实验法。","source":"《2025年1月止综合测试真题》第5、160页；《2026(1 综合测试）》第157页","incomplete":false},{"id":65,"category":"教育学","stem":"赫尔巴特传统教育理论的“三中心”是（ ）。","options":[{"key":"A","text":"教师、课堂、书本"},{"key":"B","text":"学生、经验、活动"},{"key":"C","text":"问题、合作、探究"},{"key":"D","text":"生活、社会、劳动"}],"answer":"A","explanation":"传统教育的“三中心”通常概括为教师中心、课堂中心和书本中心。","source":"《2025年1月止综合测试真题》第5、7页","incomplete":false},{"id":66,"category":"教育法规","stem":"我国义务教育的管理体制是（ ）。","options":[{"key":"A","text":"国务院领导，省级统筹规划实施，县级人民政府为主管理"},{"key":"B","text":"中央直接管理所有学校"},{"key":"C","text":"省级领导，乡镇为主管理"},{"key":"D","text":"学校自主决定、政府不参与"}],"answer":"A","explanation":"《义务教育法》规定，义务教育实行国务院领导，省、自治区、直辖市人民政府统筹规划实施，县级人民政府为主管理的体制。","source":"《2025年1月止综合测试真题》第6页","incomplete":false},{"id":67,"category":"教育学","stem":"1970年，保罗·朗格朗在国际教育领域重点倡导的理念是（ ）。","options":[{"key":"A","text":"终身教育"},{"key":"B","text":"精英教育"},{"key":"C","text":"程序教学"},{"key":"D","text":"要素教育"}],"answer":"A","explanation":"保罗·朗格朗是终身教育思想的重要倡导者，其报告推动了终身教育理念的传播。","source":"《2025年1月止综合测试真题》第6页；《2026(1 综合测试）》第154、155页","incomplete":false},{"id":68,"category":"教育史","stem":"西方最早专门论述教学方法、被视为早期系统教学法著作的是（ ）。","options":[{"key":"A","text":"《理想国》"},{"key":"B","text":"《雄辩术原理》"},{"key":"C","text":"《大教学论》"},{"key":"D","text":"《普通教育学》"}],"answer":"B","explanation":"古罗马昆体良的《雄辩术原理》（又译《论演说家的教育》）系统讨论了教育和教学问题。","source":"《2025年1月止综合测试真题》第6页","incomplete":false},{"id":69,"category":"教育史","stem":"我国古代私学兴起于（ ）。","options":[{"key":"A","text":"夏朝"},{"key":"B","text":"春秋时期"},{"key":"C","text":"隋朝"},{"key":"D","text":"明朝"}],"answer":"B","explanation":"春秋时期社会变革、文化下移，私人讲学兴起，孔子私学具有代表性。","source":"《2025年1月止综合测试真题》第6页","incomplete":false},{"id":70,"category":"教育学","stem":"家庭教育在时间上的主要特点是（ ）。","options":[{"key":"A","text":"开始最晚、持续最短"},{"key":"B","text":"开始最早、持续时间最长"},{"key":"C","text":"只发生在学龄前"},{"key":"D","text":"只发生在义务教育阶段"}],"answer":"B","explanation":"家庭是儿童最早接触的教育环境，家庭影响通常贯穿人的较长生命历程。","source":"《2025年1月止综合测试真题》第6页；《2024.11后及2025年第一批综合测试》第26页","incomplete":false},{"id":71,"category":"教育学","stem":"学校体育与自发体育活动相比，一个显著特点是（ ）。","options":[{"key":"A","text":"随意性"},{"key":"B","text":"系统性"},{"key":"C","text":"娱乐性"},{"key":"D","text":"偶然性"}],"answer":"B","explanation":"学校体育依据培养目标和课程计划组织实施，具有明确目的、规范内容和系统过程。","source":"《2025年1月止综合测试真题》第6页；《2026(1 综合测试）》第160页","incomplete":false},{"id":72,"category":"教育法规","stem":"制定《中华人民共和国义务教育法》的直接法律依据是（ ）。","options":[{"key":"A","text":"宪法和教育法"},{"key":"B","text":"刑法和民法"},{"key":"C","text":"教师法和劳动法"},{"key":"D","text":"未成年人保护法和行政处罚法"}],"answer":"A","explanation":"《义务教育法》依据宪法和教育法制定。","source":"《2025年1月止综合测试真题》第6页；《2026(1 综合测试）》第160页","incomplete":false},{"id":73,"category":"教育法规","stem":"修订后的《中华人民共和国义务教育法》自（ ）起施行。","options":[{"key":"A","text":"1986年7月1日"},{"key":"B","text":"1995年9月1日"},{"key":"C","text":"2006年9月1日"},{"key":"D","text":"2017年10月1日"}],"answer":"C","explanation":"2006年修订的《义务教育法》自2006年9月1日起施行。","source":"《2025年1月止综合测试真题》第6、8页；《2026(1 综合测试）》第157页；《2024.11后及2025年第一批综合测试》第相关题页","incomplete":false},{"id":74,"category":"教育法规","stem":"学校附近网吧违规接纳未成年人，未成年人的家人据以维护其权益的主要法律是（ ）。","options":[{"key":"A","text":"《中华人民共和国未成年人保护法》"},{"key":"B","text":"《中华人民共和国反家庭暴力法》"},{"key":"C","text":"《中华人民共和国义务教育法》"},{"key":"D","text":"《中华人民共和国公司法》"}],"answer":"A","explanation":"未成年人保护法对营业性娱乐场所、互联网上网服务营业场所保护未成年人的义务作出规定。","source":"《2025年1月止综合测试真题》第7页；《2025.11.21综合测试》第37页","incomplete":false},{"id":75,"category":"教育史","stem":"夸美纽斯在《大教学论》中系统论述并推动的教育主张是（ ）。","options":[{"key":"A","text":"普及教育和班级授课制"},{"key":"B","text":"设计教学法和道尔顿制"},{"key":"C","text":"程序教学和掌握学习"},{"key":"D","text":"发现学习和结构课程"}],"answer":"A","explanation":"夸美纽斯系统论述普及教育、班级授课制等，被视为近代教育学的重要奠基者。","source":"《2025年1月止综合测试真题》第7页；《2026(1 综合测试）》第152页","incomplete":false},{"id":76,"category":"教师制度","stem":"教师聘任合同通常约定的聘任期限为（ ）。","options":[{"key":"A","text":"一年以下"},{"key":"B","text":"三至五年"},{"key":"C","text":"十至十五年"},{"key":"D","text":"终身固定"}],"answer":"B","explanation":"资料中的教师聘任制度题给出的常见聘期为三至五年。","source":"《2025年1月止综合测试真题》第7页","incomplete":false},{"id":77,"category":"教育学","stem":"杜威现代教育理论的“三中心”是（ ）。","options":[{"key":"A","text":"教师、教材、课堂"},{"key":"B","text":"儿童（学生）、经验、活动"},{"key":"C","text":"考试、分数、升学"},{"key": y":"B","text":"学校理事会、董事会或其他形式的决策机构"},{"key":"C","text":"任课教师轮流"},{"key":"D","text":"学生会"}],"answer":"B","explanation":"民办学校依法设立理事会、董事会或其他决策机构，校长负责教育教学和行政管理的日常执行。","source":"《2025年1月止综合测试真题》第10页","incomplete":false},{"id":97,"category":"学校管理","stem":"民办学校日常教育教学和行政管理的主要负责人是（ ）。","options":[{"key":"A","text":"校长"},{"key":"B","text":"学生会主席"},{"key":"C","text":"家长委员会主任"},{"key":"D","text":"当地媒体负责人"}],"answer":"A","explanation":"校长依法负责学校的教育教学和行政管理工作。","source":"《2025年1月止综合测试真题》第10页","incomplete":false},{"id":98,"category":"教育研究","stem":"教师和研究者针对实际教育问题开展合作研究，在行动中改进实践，这种方法是（ ）。","options":[{"key":"A","text":"行动研究法"},{"key":"B","text":"历史研究法"},{"key":"C","text":"纯理论演绎法"},{"key":"D","text":"文献计量法"}],"answer":"A","explanation":"行动研究以解决真实教育情境中的实际问题为目的，强调研究与改进行动相结合。","source":"《2025年1月止综合测试真题》第10页；《2026(1 综合测试）》第155、163页","incomplete":false},{"id":99,"category":"学校事故","stem":"教师私自组织学生参加有偿课外辅导并提供食品，学生发生食物中毒。对该违法违规活动负主要责任的是（ ）。","options":[{"key":"A","text":"组织活动的教师"},{"key":"B","text":"其他未参加的教师"},{"key":"C","text":"学生家长"},{"key":"D","text":"学生本人"}],"answer":"A","explanation":"该活动由教师私自组织并实施，教师负有组织管理和安全保障义务，应对其过错承担相应责任。","source":"《2025年1月止综合测试真题》第10页","incomplete":false},{"id":100,"category":"教育史","stem":"普及义务教育最早兴起于（ ）。","options":[{"key":"A","text":"原始社会"},{"key":"B","text":"奴隶社会"},{"key":"C","text":"资本主义社会"},{"key":"D","text":"未来社会"}],"answer":"C","explanation":"近代资本主义大工业发展需要具有基本文化知识的劳动者，国家普及义务教育由此逐步兴起。","source":"《2025年1月止综合测试真题》第11页","incomplete":false},{"id":101,"category":"教育目的","stem":"确定教育目的的客观基础主要是（ ）。","options":[{"key":"A","text":"个人兴趣"},{"key":"B","text":"生产力和科学技术发展水平以及社会制度需要"},{"key":"C","text":"教师个人偏好"},{"key":"D","text":"教材篇幅"}],"answer":"B","explanation":"教育目的受社会生产力、政治经济制度和文化发展制约，同时要考虑人的身心发展规律。","source":"《2025年1月止综合测试真题》第11页","incomplete":false},{"id":102,"category":"教育目的","stem":"衡量和评价教育实施效果的根本标准是（ ）。","options":[{"key":"A","text":"考试次数"},{"key":"B","text":"教育目的"},{"key":"C","text":"校舍面积"},{"key":"D","text":"作业数量"}],"answer":"B","explanation":"教育目的规定人才培养的总方向，是评价 y":"B","text":"八年"},{"key":"C","text":"九年"},{"key":"D","text":"十二年"}],"answer":"C","explanation":"我国实行九年义务教育制度。","source":"《2025年1月止综合测试真题》第11页","incomplete":false},{"id":110,"category":"教育法规","stem":"教育活动（ ）符合国家和社会公共利益。","options":[{"key":"A","text":"应当"},{"key":"B","text":"必须"},{"key":"C","text":"可以"},{"key":"D","text":"偶尔"}],"answer":"B","explanation":"《教育法》强调教育活动必须符合国家和社会公共利益。","source":"《2025年1月止综合测试真题》第12页；《2026(1 综合测试）》第153页","incomplete":false},{"id":111,"category":"监护责任","stem":"未成年人的父母或者其他监护人（ ）为其未成年子女或者其他被监护人受教育提供必要条件。","options":[{"key":"A","text":"应当"},{"key":"B","text":"可以"},{"key":"C","text":"无须"},{"key":"D","text":"仅在学校要求时"}],"answer":"A","explanation":"保障未成年人受教育是父母或其他监护人的法定义务，应当提供必要条件。","source":"《2025年1月止综合测试真题》第12页；《2026(1 综合测试）》第154页","incomplete":false},{"id":112,"category":"教育法规","stem":"学校不履行法律法规规定的义务，情节严重或者造成严重后果时，依法承担相应法律责任的主体包括（ ）。","options":[{"key":"A","text":"仅校长"},{"key":"B","text":"学校负责人和有关直接责任人员"},{"key":"C","text":"仅学生"},{"key":"D","text":"仅家长"}],"answer":"B","explanation":"除学校承担相应责任外，对负有管理和直接责任的人员也可依法追究责任。","source":"《2025年1月止综合测试真题》第12页；《2026(1 综合测试）》第154页","incomplete":false},{"id":113,"category":"教育考试","stem":"国家教育考试的种类由（ ）确定，并由国家批准的实施教育考试的机构承办。","options":[{"key":"A","text":"国务院教育行政部门"},{"key":"B","text":"任意学校"},{"key":"C","text":"地方行业协会"},{"key":"D","text":"考试培训机构"}],"answer":"A","explanation":"国家教育考试属于国家教育管理事项，由国务院教育行政部门依法确定种类。","source":"《2025年1月止综合测试真题》第12页；《2026(1 综合测试）》第154页","incomplete":false},{"id":114,"category":"教育法规","stem":"明知校舍或者教育教学设施有危险而不采取措施，造成人员伤亡或者重大财产损失的，对直接负责人员依法追究（ ）。","options":[{"key":"A","text":"民事责任"},{"key":"B","text":"刑事责任"},{"key":"C","text":"一般责任"},{"key":"D","text":"道德责任"}],"answer":"B","explanation":"危害达到造成伤亡或重大财产损失的严重程度时，法律规定对直接负责人员依法追究刑事责任。","source":"《2025年1月止综合测试真题》第12页；《2026(1 综合测试）》第154页","incomplete":false},{"id":115,"category":"教育法规","stem":"侵犯教师、受教育者或者学校及其他教育机构的合法权益，造成损失、损害的，应当依法承担（ ）。","options":[{"key":"A","text":"民事责任"},{"key":"B","text":"行政许可责任"},{"key":"C","text":"学术责任"},{"key":"D","text":"考试责任"}],"answer":"A","explanation":"造成民事权益损害的，应依法承担停止侵害、赔偿损失等民事责任；若另有行政或刑事违法，还可能承担相应责任。","source":"《2025年1月止综合测试真题》第12页；《2026(1 综合测试）》第154页","incomplete":false},{"id":116,"category":"教育收费","stem":"学校及其他教育机构违反国家规定向受教育者收取费用的，教育行政部门应当责令其（ ）。","options":[{"key":"A","text":"退还所收费用"},{"key":"B","text":"双倍收费"},{"key":"C","text":"转为捐款"},{"key":"D","text":"自行保留"}],"answer":"A","explanation":"对违法收取的费用，教育行政部门应责令退还，并可依法处分有关责任人员。","source":"《2025年1月止综合测试真题》第13页；《2026(1 综合测试）》第154页","incomplete":false},{"id":117,"category":"教育经费","stem":"各级人民政府教育财政拨款的增长（ ）高于财政经常性收入的增长。","options":[{"key":"A","text":"应当"},{"key":"B","text":"可以"},{"key":"C","text":"无须"},{"key":"D","text":"不得"}],"answer":"A","explanation":"教育法规定教育财政拨款的增长应当高于财政经常性收入的增长，并保障生均教育费用等逐步增长。","source":"《2025年1月止综合测试真题》第13页；《2026(1 综合测试）》第154页","incomplete":false},{"id":118,"category":"诉讼法","stem":"被告人一方上诉，二审法院认为原判事实清楚、证据确凿但量刑畸轻。依照“上诉不加刑”原则，适当的处理是（ ）。","options":[{"key":"A","text":"直接加重刑罚"},{"key":"B","text":"为平衡而减轻刑罚"},{"key":"C","text":"不得因被告人一方上诉而加重，可依法维持原判"},{"key":"D","text":"追究一审法官刑事责任"}],"answer":"C","explanation":"仅由被告人一方提出上诉的案件，二审不得加重刑罚。题设没有检察机关抗诉等例外信息，因此不能直接加刑。","source":"《2025年1月止综合测试真题》第13页","incomplete":false},{"id":119,"category":"教育法","stem":"国家在受教育者中进行的核心价值教育包括（ ）。","options":[{"key":"A","text":"个人主义、功利主义、消费主义"},{"key":"B","text":"爱国主义、集体主义、社会主义"},{"key":"C","text":"自由主义、无政府主义、享乐主义"},{"key":"D","text":"技术主义、实用主义、形式主义"}],"answer":"B","explanation":"《教育法》规定国家在受教育者中进行爱国主义、集体主义、社会主义教育，并开展理想、道德、纪律、法治等教育。","source":"《2025年1月止综合测试真题》第13页","incomplete":false},{"id":120,"category":"劳动与未成年人保护","stem":"《禁止使用童工规定》的制定依据包括（ ）。","options":[{"key":"A","text":"宪法、劳动法和未成年人保护法"},{"key":"B","text":"公司法和证券法"},{"key":"C","text":"刑事诉讼法和仲裁法"},{"key":"D","text":"商标法和专利法"}],"answer":"A","explanation":"该规定旨在保护未成年人身心健康、促进义务教育实施和维护其合法权益，制定依据包括宪法、劳动法和未成年人保护法。","source":"《2025年1月止综合测试真题》第13页","incomplete":false},{"id":121,"category":"教育法规","stem":"教师将扰乱课堂秩序的学生赶出教室并罚做俯卧撑，造成学生受伤。下列判断正确的是（ ）。","options":[{"key":"A","text":"教师行为合理，学生自行负责"},{"key":"B","text":"教师侵犯学生受教育权和人身权，学校应依法处理"},{"key":"C","text":"只侵犯财产权"},{"key":"D","text":"只要学生先违纪，教师就不承担任何责任"}],"answer":"B","explanation":"维护课堂秩序应采用合法、适当的教育惩戒方式。剥夺上课机会并实施造成伤害的体罚，侵害学生受教育权和人身权。","source":"《2025年1月止综合测试真题》第15页","incomplete":false},{"id":122,"category":"学校纪律","stem":"学校对高中阶段学生实施纪律处分时，可以采用的方式是（ ）。","options":[{"key":"A","text":"警告、记过等校纪处分"},{"key":"B","text":"送劳动教养"},{"key":"C","text":"实施体罚"},{"key":"D","text":"随意没收个人合法财物"}],"answer":"A","explanation":"学校可依规给予警告、严重警告、记过等处分，但不得采用已废止或违法的人身强制、体罚等方式。","source":"《2025年1月止综合测试真题》第15页；《2026(1 综合测试）》第159页","incomplete":false},{"id":123,"category":"未成年人司法保护","stem":"依资料所依据的规定，对未成年人犯罪一律不公开审理的年龄范围是（ ）。","options":[{"key":"A","text":"14周岁以下"},{"key":"B","text":"14周岁以上不满16周岁"},{"key":"C","text":"16周岁以上不满18周岁"},{"key":"D","text":"18周岁以上"}],"answer":"B","explanation":"资料采用当时题库口径：14周岁以上不满16周岁的未成年人犯罪案件一律不公开审理；相关法律条文后续可能调整，网页使用时宜标明题库年份。","source":"《2025年1月止综合测试真题》第15页","incomplete":false},{"id":124,"category":"未成年人保护","stem":"父母让15周岁的未成年人脱离监护、单独居住，主要违反（ ）。","options":[{"key":"A","text":"《预防未成年人犯罪法》"},{"key":"B","text":"《公司法》"},{"key":"C","text":"《证券法》"},{"key":"D","text":"《专利法》"}],"answer":"A","explanation":"相关法律要求父母或其他监护人不得让未满规定年龄的未成年人脱离监护单独生活。","source":"《2025年1月止综合测试真题》第15页","incomplete":false},{"id":125,"category":"学生伤害事故","stem":"寄宿学校校车司机停车后未清点人数即驶离，学生追车摔伤。对外承担主要责任的主体是（ ）。","options":[{"key":"A","text":"学生本人"},{"key":"B","text":"寄宿学校"},{"key":"C","text":"同车学生"},{"key":"D","text":"路边商户"}],"answer":"B","explanation":"接送学生属于学校组织管理活动。司机履职中的过错应由学校依法承担相应责任，学校可再依内部关系追责。","source":"《2025年1月止综合测试真题》第15页；《2026(1 综合测试）》第161、162页","incomplete":false},{"id":126,"category":"学生伤害事故","stem":"学生陈某故意移开同学座椅，导致该同学尾椎骨裂。学校未尽到教育管理职责。依法应承担相应责任的是（ ）。","options":[{"key":"A","text":"只有任课教师"},{"key":"B","text":"陈某和学校"},{"key":"C","text":"只有受伤学生"},{"key":"D","text":"所有学生平均分担"}],"answer":"B","explanation":"陈某的行为直接导致损害；学校对在校学生负有教育、管理和保护职责，未尽职责的也应承担相应责任。","source":"《2025年1月止综合测试真题》第16页；《2026(1 综合测试）》第162页","incomplete":false},{"id":127,"category":"教师资格","stem":"依法受理并认定中小学教师资格的机构通常是（ ）。","options":[{"key":"A","text":"县级以上人民政府教育行政部门"},{"key":"B","text":"任意培训机构"},{"key":"C","text":"学生家长委员会"},{"key":"D","text":"出版社"}],"answer":"A","explanation":"教师资格由依法具有认定权限的教育行政部门认定，培训机构不能自行颁发法定教师资格。","source":"《2025年1月止综合测试真题》第16页","incomplete":false},{"id":128,"category":"学生伤害事故","stem":"自然课教师授课后让学生自由活动，未制止危险嬉闹，导致学生眼睛受伤致残。学校应（ ）。","options":[{"key":"A","text":"完全不承担责任"},{"key":"B","text":"因未尽教育管理职责承担相应责任"},{"key":"C","text":"只由任课教师个人对外承担全部责任"},{"key":"D","text":"由受伤学生承担全部责任"}],"answer":"B","explanation":"教师履行职务时未尽到必要的管理、告诫和制止义务，属于学校教育管理职责范围内的过错，学校应依法承担相应责任。","source":"《2025年1月止综合测试真题》第17页；《2026(1 综合测试）》第162、163页","incomplete":false},{"id":129,"category":"义务教育","stem":"县级人民政府有关部门应均衡配置本行政区域内学校师资力量，组织校长、教师进行（ ）。","options":[{"key":"A","text":"培训和流动"},{"key":"B","text":"商业兼职"},{"key":"C","text":"自由停课"},{"key":"D","text":"校外收费补课"}],"answer":"A","explanation":"义务教育法要求通过培训和流动等方式促进师资均衡，加强薄弱学校建设。","source":"《2025年1月止综合测试真题》第17页；《2026(1 综合测试）》第157、160页","incomplete":false},{"id":130,"category":"法律解释","stem":"学生手册规定“禁止男女生之间互访宿舍”，解释为“男女生不得无故进入异性宿舍”。这种解释主要属于（ ）。","options":[{"key":"A","text":"文义解释"},{"key":"B","text":"历史解释"},{"key":"C","text":"比较法解释"},{"key":"D","text":"目的解释"}],"answer":"A","explanation":"解释直接依据条文通常语义，把“互访”理解为进入异性宿舍，属于文义（文法）解释。","source":"《2025年1月止综合测试真题》第17页；《2026(1 综合测试）》第80页","incomplete":false},{"id":131,"category":"义务教育","stem":"实施义务教育，学校依法不得收取（ ）。","options":[{"key":"A","text":"学费、杂费"},{"key":"B","text":"依法代收的自愿性校服费"},{"key":"C","text":"经批准的社会培训费"},{"key":"D","text":"大学学费"}],"answer":"A","explanation":"义务教育免收学费、杂费，保障适龄儿童少年平等接受义务教育。","source":"《2025年1月止综合测试真题》第17页；《2026(1 综合测试）》第161页","incomplete":false},{"id":132,"category":"义务教育","stem":"符合义务教育免试就近入学原则的是（ ）。","options":[{"key":"A","text":"按户籍所在地和教育行政部门划定的学区入学"},{"key":"B","text":"必须选择全市排名最高的学校"},{"key":"C","text":"以竞赛成绩作为唯一入学条件"},{"key":"D","text":"由培训机构决定学校"}],"answer":"A","explanation":"义务教育阶段实行免试就近入学，教育行政部门根据适龄儿童少年数量、学校分布和规模等合理划定学区。","source":"《2025年1月止综合测试真题》第17页；《2026(1 综合测试）》第161页","incomplete":false},{"id":133,"category":"教育考试","stem":"在国家教育考试中作弊的，依法宣布考试无效的机关是（ ）。","options":[{"key":"A","text":"教育行政部门"},{"key":"B","text":"考生所在社区"},{"key":"C","text":"任意培训机构"},{"key":"D","text":"新闻媒体"}],"answer":"A","explanation":"教育行政部门有权依法宣布有关国家教育考试无效，并对责任人员作出相应处理。","source":"《2025年1月止综合测试真题》第17页；《2026(1 综合测试）》第161页","incomplete":false},{"id":134,"category":"义务教育","stem":"义务教育教学应注重培养学生的（ ）。","options":[{"key":"A","text":"独立思考能力、创新能力和实践能力"},{"key":"B","text":"机械背诵能力"},{"key":"C","text":"单一应试技巧"},{"key":"D","text":"服从性和依赖性"}],"answer":"A","explanation":"义务教育法强调面向全体学生，促进全面发展，注重培养独立思考、创新和实践能力。","source":"《2025年1月止综合测试真题》第18页；《2026(1 综合测试）》第159页","incomplete":false},{"id":135,"category":"教师资格","stem":"曾因故意犯罪受到有期徒刑以上刑事处罚的人申请教师资格，下列判断正确的是（ ）。","options":[{"key":"A","text":"刑满后当然取得"},{"key":"B","text":"培训后即可取得"},{"key":"C","text":"五年后自动取得"},{"key":"D","text":"依法不能取得教师资格；已取得的，丧失教师资格"}],"answer":"D","explanation":"教师法规定，受到剥夺政治权利或者故意犯罪受到有期徒刑以上刑事处罚的，不能取得教师资格；已经取得的，丧失教师资格。","source":"《2025年1月止综合测试真题》第18页；《2026(1 综合测试）》第162页","incomplete":false},{"id":136,"category":"学校管理","stem":"学校规定教师迟到一次罚款10元、缺勤一次罚款50元。该做法（ ）。","options":[{"key":"A","text":"正确，学校可任意罚款"},{"key":"B","text":"不正确，学校不具有行政罚款权"},{"key":"C","text":"正确，因为属于自主办学"},{"key":"D","text":"只有警告后才可罚款"}],"answer":"B","explanation":"罚款属于行政处罚种类，须有法定主体和依据。学校可以依规考核管理，但不能自行行使行政罚款权。","source":"《2025年1月止综合测试真题》第18页；《2026(1 综合测试）》第162页","incomplete":false},{"id":137,"category":"教育学","stem":"传统教育与现代教育两个典型的对立代表人物是（ ）。","options":[{"key":"A","text":"赫尔巴特和杜威"},{"key":"B","text":"孔子和孟子"},{"key":"C","text":"夸美纽斯和洛克"},{"key":"D","text":"凯洛夫和赞科夫"}],"answer":"A","explanation":"教育学史上常以赫尔巴特代表传统教育、杜威代表现代教育。","source":"《2025年1月止综合测试真题》第18页；《2026(1 综合测试）》第155页","incomplete":false},{"id":138,"category":"教师法","stem":"教师是履行教育教学职责的（ ）。","options":[{"key":"A","text":"专业人员"},{"key":"B","text":"行政处罚人员"},{"key":"C","text":"商业销售人员"},{"key":"D","text":"临时志愿者"}],"answer":"A","explanation":"教师法明确教师是履行教育教学职责的专业人员，承担教书育人、提高民族素质等使命。","source":"《2025年1月止综合测试真题》第18页","incomplete":false},{"id":139,"category":"教师义务","stem":"下列属于教师法规定的教师义务的是（ ）。","options":[{"key":"A","text":"制止有害于学生的行为，并不断提高教育教学业务水平"},{"key":"B","text":"任意公开学生隐私"},{"key":"C","text":"随意停止学生上课"},{"key":"D","text":"以罚款代替教育"}],"answer":"A","explanation":"教师应关心爱护学生，制止有害于学生的行为，批评抵制不利于学生健康成长的现象，并不断提高业务水平。","source":"《2025年1月止综合测试真题》第18页","incomplete":false},{"id":140,"category":"德育","stem":"学校有目的、有计划、系统地对学生进行德育的基本途径是（ ）。","options":[{"key":"A","text":"思想政治课与其他学科教学"},{"key":"B","text":"偶然的社会传闻"},{"key":"C","text":"学生自发活动"},{"key":"D","text":"单纯行政命令"}],"answer":"A","explanation":"课堂教学，特别是思想政治课与其他学科教学，是学校实施德育最基本、最经常的途径。","source":"《2025年1月止综合测试真题》第19页；《2026(1 综合测试）》第159页","incomplete":false},{"id":141,"category":"学校管理","stem":"1993年《中国教育改革和发展纲要》明确，中等及中等以下学校实行（ ）。","options":[{"key":"A","text":"校长负责制"},{"key":"B","text":"书记个人负责制"},{"key":"C","text":"学生会负责制"},{"key":"D","text":"家长委员会负责制"}],"answer":"A","explanation":"纲要提出中等及中等以下各类学校实行校长负责制，校长全面贯彻教育方针并依靠教职工办学。","source":"《2025年1月止综合测试真题》第19页；《2026(1 综合测试）》第163页","incomplete":false},{"id":142,"category":"教师资格","stem":"教师资格制度主要依据（ ）制定和实施。","options":[{"key":"A","text":"《中华人民共和国教师法》及配套法规"},{"key":"B","text":"《中华人民共和国公司法》"},{"key":"C","text":"《中华人民共和国证券法》"},{"key":"D","text":"《中华人民共和国海商法》"}],"answer":"A","explanation":"教师资格认定以教师法、教师资格条例及其实施办法等为依据。","source":"《2025年1月止综合测试真题》第19页；《2026(1 综合测试）》第163页","incomplete":false},{"id":143,"category":"未成年人保护","stem":"收留夜不归宿的未成年人时，应征得其父母或其他监护人同意，或者在（ ）内及时通知、报告。","options":[{"key":"A","text":"12小时"},{"key":"B","text":"24小时"},{"key":"C","text":"48小时"},{"key":"D","text":"7日"}],"answer":"B","explanation":"资料题采用24小时的通知或报告时限。","source":"《2025年1月止综合测试真题》第19页","incomplete":false},{"id":144,"category":"德育原则","stem":"马卡连柯提出的“平行教育原则”体现了（ ）。","options":[{"key":"A","text":"集体教育与个别教育相结合"},{"key":"B","text":"严格要求与尊重信任相结合"},{"key":"C","text":"正面教育与纪律约束相结合"},{"key":"D","text":"教育影响的一致性与连贯性"}],"answer":"A","explanation":"教师先影响集体，再通过集体影响个人，使集体和教师形成平行的教育力量。","source":"《2025年1月止综合测试真题》第20页","incomplete":false},{"id":145,"category":"特殊教育","stem":"普通学校对具有接受普通教育能力的残疾适龄儿童、少年应当（ ）。","options":[{"key":"A","text":"接收其随班就读并提供学习、康复帮助"},{"key":"B","text":"一律拒收"},{"key":"C","text":"只允许旁听"},{"key":"D","text":"要求其放弃义务教育"}],"answer":"A","explanation":"义务教育坚持平等受教育，普通学校应接收具有接受普通教育能力的残疾儿童少年随班就读并给予帮助。","source":"《2025年1月止综合测试真题》第20页","incomplete":false},{"id":146,"category":"教学方法","stem":"教师系统连贯地向学生传授知识、表达情感并培养价值观，主要采用的教学方法是（ ）。","options":[{"key":"A","text":"讲授法"},{"key":"B","text":"练习法"},{"key":"C","text":"实验法"},{"key":"D","text":"陶冶法"}],"answer":"A","explanation":"讲授法由教师通过语言系统传授知识，也可表达思想情感和价值判断。","source":"《2025年1月止综合测试真题》第20页","incomplete":false},{"id":147,"category":"学生伤害事故","stem":"学校组织春游，教师已反复进行安全教育，学生仍违反明确警示攀爬假山而受伤。无其他管理过错时，主要责任应由（ ）。","options":[{"key":"A","text":"学生按其认知能力承担相应责任"},{"key":"B","text":"学校无条件承担全部责任"},{"key":"C","text":"教师个人承担全部责任"},{"key":"D","text":"公园其他游客承担"}],"answer":"A","explanation":"学校已履行合理教育、告知义务，而伤害主要源于学生违反明确警示的行为，应结合学生年龄和认知能力确定其自身责任。","source":"《2025年1月止综合测试真题》第20页","incomplete":false},{"id":148,"category":"教育史","stem":"古代社会教育的典型特点之一是（ ）。","options":[{"key":"A","text":"完全没有阶级性"},{"key":"B","text":"具有阶级性"},{"key":"C","text":"教育与社会完全无关"},{"key":"D","text":"已经普及义务教育"}],"answer":"B","explanation":"进入阶级社会后，教育资源和培养目标受到阶级关系影响，古代学校教育具有鲜明阶级性。","source":"《2025年1月止综合测试真题》第21页","incomplete":false},{"id":149,"category":"扫盲教育","stem":"按题库所引《扫除文盲工作条例》，农民个人脱盲应识读的汉字数量为（ ）。","options":[{"key":"A","text":"1000个"},{"key":"B","text":"1500个"},{"key":"C","text":"2000个"},{"key":"D","text":"2500个"}],"answer":"B","explanation":"资料题给出的农民个人脱盲识字标准为1500个汉字。","source":"《2025年1月止综合测试真题》第21页","incomplete":false},{"id":150,"category":"教学原则","stem":"“君子之教，喻也：道而弗牵，强而弗抑，开而弗达。”体现的教学原则是（ ）。","options":[{"key":"A","text":"启发性原则"},{"key":"B","text":"量力性原则"},{"key":"C","text":"巩固性原则"},{"key":"D","text":"统一要求原则"}],"answer":"A","explanation":"教师应引导而不牵着走、激励而不强迫、启发而不把结论全部说尽，体现启发性。","source":"《2025年1月止综合测试真题》第21页","incomplete":false},{"id":151,"category":"义务教育","stem":"适龄儿童、少年因身体状况需要延缓入学或者休学的，其监护人提出申请后，由（ ）批准。","options":[{"key":"A","text":"学校任意一名教师"},{"key":"B","text":"乡镇人民政府或者县级人民政府教育行政部门"},{"key":"C","text":"学生会"},{"key":"D","text":"培训机构"}],"answer":"B","explanation":"义务教育法规定，延缓入学或休学申请由当地乡镇人民政府或者县级人民政府教育行政部门批准。","source":"《2025年1月止综合测试真题》第21页；《2026(1 综合测试）》第158页","incomplete":false},{"id":152,"category":"宪法与行政法","stem":"根据我国宪法，国务院有权制定和发布（ ）。","options":[{"key":"A","text":"教育行政法规"},{"key":"B","text":"教育法律"},{"key":"C","text":"地方性法规"},{"key":"D","text":"学校内部班规"}],"answer":"A","explanation":"国务院根据宪法和法律制定行政法规；法律由全国人大及其常委会制定。","source":"《2025年1月止综合测试真题》第21页；《2026(1 综合测试）》第158、159页","incomplete":false},{"id":153,"category":"教育学","stem":"人类社会最早产生的教育学以（ ）作为研究对象。","options":[{"key":"A","text":"一般教育现象和教育问题"},{"key":"B","text":"仅高等教育"},{"key":"C","text":"仅特殊教育"},{"key":"D","text":"仅职业教育"}],"answer":"A","explanation":"教育学是研究教育现象和教育问题、揭示教育规律的科学。","source":"《2025年1月止综合测试真题》第21页","incomplete":false},{"id":154,"category":"教育史","stem":"“教学相长”等教育思想最早集中见于（ ）。","options":[{"key":"A","text":"《学记》"},{"key":"B","text":"《理想国》"},{"key":"C","text":"《大教学论》"},{"key":"D","text":"《教育漫话》"}],"answer":"A","explanation":"《学记》是我国古代系统论述教育教学问题的著作，其中提出“教学相长”等思想。","source":"《2025年1月止综合测试真题》第21页","incomplete":false},{"id":155,"category":"教学原则","stem":"下列成语中，最能体现启发式教学思想的是（ ）。","options":[{"key":"A","text":"举一反三"},{"key":"B","text":"循规蹈矩"},{"key":"C","text":"墨守成规"},{"key":"D","text":"按部就班"}],"answer":"A","explanation":"“举一反三”强调由已知启发未知、触类旁通，体现启发式教学。","source":"《2025年1月止综合测试真题》第21页","incomplete":false},{"id":156,"category":"科学阅读","stem":"有些动物身体透明，从光学角度看，主要原因是其身体组织（ ）。","options":[{"key":"A","text":"能吸收全部可见光"},{"key":"B","text":"几乎不能吸收可见光，且散射较弱"},{"key":"C","text":"只反射红光"},{"key":"D","text":"不断主动发光"}],"answer":"B","explanation":"物体呈现颜色通常与选择性吸收、反射可见光有关。组织对可见光吸收和散射都很弱时，会表现得较透明。","source":"《2025年1月止综合测试真题》第28页","incomplete":false},{"id":157,"category":"教育心理","stem":"布卢姆把教育目标分为（ ）三个领域。","options":[{"key":"A","text":"认知、情感、动作技能"},{"key":"B","text":"知识、纪律、考试"},{"key":"C","text":"德育、智育、体育"},{"key":"D","text":"教师、学生、教材"}],"answer":"A","explanation":"布卢姆教育目标分类体系通常分为认知、情感和动作技能三个领域。","source":"《2026(1 综合测试）》第158页；《2024.11后及2025年第一批综合测试》相关题页","incomplete":false},{"id":158,"category":"教学论","stem":"教学活动的本质是一种（ ）。","options":[{"key":"A","text":"特殊的认识活动"},{"key":"B","text":"单纯的体力活动"},{"key":"C","text":"商业交换活动"},{"key":"D","text":"行政处罚活动"}],"answer":"A","explanation":"学生的学习是在教师引导下，以间接经验为主、兼有直接经验的特殊认识活动。","source":"《2026(1 综合测试）》第153页","incomplete":false},{"id":159,"category":"教育与社会","stem":"教育对政治经济制度的影响，主要通过（ ）。","options":[{"key":"A","text":"培养所需要的人才并形成社会舆论"},{"key":"B","text":"改变自然气候"},{"key":"C","text":"增加商品库存"},{"key":"D","text":"替代全部法律制度"}],"answer":"A","explanation":"教育通过培养人才、传播政治思想和形成社会舆论作用于政治经济制度。","source":"《2026(1 综合测试）》第152页","incomplete":false},{"id":160,"category":"教育学","stem":"“强调学生的一般发展，并要求教学走在发展前面”的教育家是（ ）。","options":[{"key":"A","text":"赞科夫"},{"key":"B","text":"凯洛夫"},{"key":"C","text":"赫尔巴特"},{"key":"D","text":"斯金纳"}],"answer":"A","explanation":"赞科夫的发展性教学理论强调以高难度、高速度等原则促进学生的一般发展。","source":"《2026(1 综合测试）》第160页","incomplete":false},{"id":161,"category":"心理学","stem":"妄想的基本特征是（ ）。","options":[{"key":"A","text":"以事实为基础且可随证据立即改变"},{"key":"B","text":"内容完全客观"},{"key":"C","text":"脱离现实的病理性信念，虽与事实不符仍坚信不疑"},{"key":"D","text":"只是普通想象"}],"answer":"C","explanation":"妄想是一种病理性的歪曲信念，内容与事实不符，患者仍坚信不疑，且常与自身密切相关。","source":"《2026(1 综合测试）》第63页","incomplete":false},{"id":162,"category":"社会心理","stem":"“维特效应”主要指（ ）。","options":[{"key":"A","text":"知名人物或媒体报道自杀事件后，短期内模仿性自杀增加"},{"key":"B","text":"运动后学习效率提高"},{"key":"C","text":"群体合作必然降低效率"},{"key":"D","text":"阅读小说使记忆永久增强"}],"answer":"A","explanation":"“维特效应”指自杀事件及其传播可能诱发模仿行为，媒体报道需要遵循负责任原则。","source":"《2026(1 综合测试）》第64页","incomplete":false},{"id":163,"category":"文化常识","stem":"“人生自古谁无死，留取丹心照汗青”出自文天祥的（ ）。","options":[{"key":"A","text":"《过零丁洋》"},{"key":"B","text":"《正气歌》"},{"key":"C","text":"《岳阳楼记》"},{"key":"D","text":"《赤壁赋》"}],"answer":"A","explanation":"该名句出自南宋文天祥《过零丁洋》，表达舍生取义、忠贞报国之志。","source":"《2025年1月止综合测试真题》第相关语言页；《2024.11后及2025年第一批综合测试》第相关题页","incomplete":false},{"id":164,"category":"文学常识","stem":"“世上本没有路，走的人多了，也便成了路”出自鲁迅的（ ）。","options":[{"key":"A","text":"《故乡》"},{"key":"B","text":"《孔乙己》"},{"key":"C","text":"《阿Q正传》"},{"key":"D","text":"《祝福》"}],"answer":"A","explanation":"这句话出自鲁迅小说《故乡》，以“路”比喻希望与实践开辟的新方向。","source":"《2024.11后及2025年第一批综合测试》第40页","incomplete":false},{"id":165,"category":"实词辨析","stem":"一些媒体越来越被市场____，不再具有公共属性，自然也很难提供有价值的公共产品；公共价值也逐渐____了踪迹。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"利用；消失"},{"key":"B","text":"裹挟；隐匿"},{"key":"C","text":"主导；收敛"},{"key":"D","text":"解释；显现"}],"answer":"B","explanation":"“裹挟”强调媒体受到市场力量影响而被带动；“隐匿踪迹”搭配自然。其余搭配或语义不合。","source":"《2026(1 综合测试）》第14、66页","incomplete":false},{"id":166,"category":"实词辨析","stem":"除夕夜，高耸入云的海心塔在灯光映照下不断变色，整体变色效果为新春增添了一道____的风景。填入最恰当的一项是（ ）。","options":[{"key":"A","text":"壮丽"},{"key":"B","text":"绮丽"},{"key":"C","text":"华丽"},{"key":"D","text":"艳丽"}],"answer":"C","explanation":"“华丽”侧重美丽而有光彩，适合形容灯光映照下不断变幻、光彩华美的城市景观。","source":"《2026(1 综合测试）》第12、66页","incomplete":false},{"id":167,"category":"教育理念","stem":"“每个学生都是____的，怎样让每个学生得到发展，教师会遇到很多无法预料的问题。”填入最恰当的一项是（ ）。","options":[{"key":"A","text":"相互联系"},{"key":"B","text":"变化发展"},{"key":"C","text":"举世无双"},{"key":"D","text":"独一无二"}],"answer":"D","explanation":"语境强调学生之间存在个体差异，“独一无二”最准确，也能与因材施教的教育要求衔接。","source":"《2026(1 综合测试）》第17、67页","incomplete":false},{"id":168,"category":"实词辨析","stem":"政协委员们不约而同地指出，社会上的种种腐败现象正在____社会肌体。填入最恰当的一项是（ ）。","options":[{"key":"A","text":"侵害"},{"key":"B","text":"侵蚀"},{"key":"C","text":"腐蚀"},{"key":"D","text":"吞噬"}],"answer":"B","explanation":"“侵蚀”常比喻坏的思想或事物逐渐损害事物基础，与“腐败现象”“社会肌体”搭配贴切。","source":"《2026(1 综合测试）》第17、67页","incomplete":false},{"id":169,"category":"时政常识","stem":"科学发展观的第一要义、核心和基本要求依次是（ ）。","options":[{"key":"A","text":"发展；以人为本；全面协调可持续"},{"key":"B","text":"改革；经济建设；共同富裕"},{"key":"C","text":"开放；依法治国；科技创新"},{"key":"D","text":"稳定；增强国力；统筹城乡"}],"answer":"A","explanation":"科学发展观的第一要义是发展，核心是以人为本，基本要求是全面协调可持续。","source":"《2026(1 综合测试）》第16、67页","incomplete":false},{"id":170,"category":"阅读理解","stem":"中国传统学术较重书画、较轻雕塑，这种历史惯性影响了近现代收藏审美；新兴收藏者多关注铜鎏金佛像的艺术表象，却对更能体现雕塑文化和历史岁月的高古石雕举棋不定。文段主要说明（ ）。","options":[{"key":"A","text":"高古石雕制作工艺已经失传"},{"key":"B","text":"高古石雕不受重视的历史与审美原因"},{"key":"C","text":"所有铜鎏金佛像都没有史料价值"},{"key":"D","text":"雕塑收藏价格必然等于历史价值"}],"answer":"B","explanation":"文段先追溯传统学术轻视雕塑的历史，再说明这种审美惯性延续到收藏领域，中心是解释高古石雕未受重视的原因。","source":"《2026(1 综合测试）》第21—22页","incomplete":false},{"id":171,"category":"阅读理解","stem":"三十多年前，精密计算模型已预测二氧化碳增加会使全球升温，但科学家和公众一度并未重视，甚至乐观地认为这会促进农业。由此可以推出（ ）。","options":[{"key":"A","text":"全球变暖一定只会损害农业"},{"key":"B","text":"早期人们尚未充分认识全球变暖的严重影响"},{"key":"C","text":"所有气候模型都不可靠"},{"key":"D","text":"二氧化碳增加不会影响气温"}],"answer":"B","explanation":"材料对比了已有升温预测与当时社会的乐观、平静态度，表明早期人们尚未充分认识问题的严重性。","source":"《2026(1 综合测试）》第24—25、69页","incomplete":false},{"id":172,"category":"阅读理解","stem":"未来人口增长和经济发展将推动全球能源需求增加，能源利用效率的提高只能抵消其中相当一部分增长。下列表述不正确的是（ ）。","options":[{"key":"A","text":"能源与经济发展关系密切"},{"key":"B","text":"未来能源需求仍可能增加"},{"key":"C","text":"提高能源效率会抵消部分需求增长"},{"key":"D","text":"提高能源效率最终会完全抑制能源需求增长"}],"answer":"D","explanation":"原文只说效率提高会抵消相当一部分需求增长，并未说会完全抑制或逆转能源需求增长。","source":"《2026(1 综合测试）》第26—27页；《2025年1月止综合测试真题》第60页","incomplete":false},{"id":173,"category":"词语辨析","stem":"面对人大代表依法提出的问题，有些部门负责人虽然不能圆满答复，但都虚心接受。与“人大代表依法提出问题”最恰当的词是（ ）。","options":[{"key":"A","text":"质疑"},{"key":"B","text":"质问"},{"key":"C","text":"对质"},{"key":"D","text":"质询"}],"answer":"D","explanation":"“质询”指人大代表依法就政府工作向有关国家机关提出询问并要求答复，具有特定的政务语境。","source":"《2026(1 综合测试）》第10—11、66页","incomplete":false},{"id":174,"category":"语言运用","stem":"网络飞速发展，使社会各方面的____加强、信息交流加快、生产和工作效率提高，同时也可能____新的社会问题。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"关联；催生"},{"key":"B","text":"联系；带来"},{"key":"C","text":"交往；杜绝"},{"key":"D","text":"关系；消灭"}],"answer":"B","explanation":"“联系加强”是固定、自然的搭配；网络发展既提高效率，也可能“带来”新的社会问题。","source":"《2026(1 综合测试）》第64页","incomplete":false},{"id":175,"category":"网络法治","stem":"有人认为，要求互联网服务提供者对用户发布的信息进行____，不利于言论自由；但若把散布谣言也视为自由，显然是____。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"过滤；偷换概念"},{"key":"B","text":"整合；断章取义"},{"key":"C","text":"评价；混淆时空"},{"key":"D","text":"转发；循序渐进"}],"answer":"A","explanation":"前一空是对违法有害信息的筛查、过滤；把散布谣言偷换成受保护的言论自由，属于偷换概念。","source":"《2026(1 综合测试）》第82页","incomplete":false},{"id":176,"category":"说明文阅读","stem":"超细颗粒功能制备机先用高速气流粉碎并自动分级颗粒，再加入纳米或微米材料进行复合包覆，使药品颗粒防止团聚并保护药效。这段文字主要说明该设备的（ ）。","options":[{"key":"A","text":"销售渠道和市场规模"},{"key":"B","text":"设计原理及其在药品粉碎、制备中的应用"},{"key":"C","text":"制造成本和维修方法"},{"key":"D","text":"操作人员的培训制度"}],"answer":"B","explanation":"材料按工作流程介绍设备的设计原理，并以药品超细粉碎、包覆为例说明其应用。","source":"《2026(1 综合测试）》第83—84页","incomplete":false},{"id":177,"category":"成语运用","stem":"依次填入下列句子，最恰当的一组是（ ）。①环境污染日趋严重，人类这种____的行为如不停止，将自毁生存空间。②某公司非法占地建设别墅，最终____，建筑被责令拆除。③制造铁路爆炸案的罪犯终于____，被逮捕归案。","options":[{"key":"A","text":"玩火自焚；自食其果；落入法网"},{"key":"B","text":"作茧自缚；安然无恙；逍遥法外"},{"key":"C","text":"自作自受；因祸得福；功成名就"},{"key":"D","text":"自食其果；左右逢源；逃之夭夭"}],"answer":"A","explanation":"“玩火自焚”强调危险行为终将害己；“自食其果”指自己承担恶果；罪犯被捕应用“落入法网”。","source":"《2026(1 综合测试）》第84—85页","incomplete":false},{"id":178,"category":"语言逻辑","stem":"关于“这块麦田今年增产”的原因，下列说法最严谨的是（ ）。","options":[{"key":"A","text":"肯定是化肥用得多"},{"key":"B","text":"一定与化肥无关"},{"key":"C","text":"只能是气候原因"},{"key":"D","text":"可能是化肥用得多，也可能另有原因"}],"answer":"D","explanation":"在证据不足时，不能把相关或可能原因说成唯一、确定原因；“可能”表述保留了其他解释。","source":"《2026(1 综合测试）》第85页","incomplete":false},{"id":179,"category":"关联词","stem":"____虚心承认错误和缺点，____能从错误和缺点中学到新的知识和本领，____取得进步。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"如果；或者；就"},{"key":"B","text":"只有；才；从而"},{"key":"C","text":"即使；也；但是"},{"key":"D","text":"因为；所以；反而"}],"answer":"B","explanation":"句子表达必要条件和结果关系，应用“只有……才……从而……”。","source":"《2026(1 综合测试）》第85页","incomplete":false},{"id":180,"category":"语境填空","stem":"影响消费者口碑的，有时不是产品主体，而是纽扣、按钮等不太引人注意的零部件。这些看似____的失误足以引起反感。赢得口碑必须把基础工作做细、做到位并____。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"微不足道；持之以恒"},{"key":"B","text":"漫不经心；有的放矢"},{"key":"C","text":"随处可见；面面俱到"},{"key":"D","text":"举足轻重；半途而废"}],"answer":"A","explanation":"“微不足道”与“不太引人注意”照应；品质控制需要长期坚持，应用“持之以恒”。","source":"《2026(1 综合测试）》第80页","incomplete":false},{"id":181,"category":"语境填空","stem":"每一个老字号的成长都凝结着经营者的____，但有些老字号如今已____。老字号的兴衰与社会生活____。依次填入最恰当的一项是（ ）。","options":[{"key":"A","text":"苦心孤诣；奄奄一息；息息相关"},{"key":"B","text":"人生百态；朝不保夕；互不相干"},{"key":"C","text":"心酸无奈；蒸蒸日上；毫无联系"},{"key":"D","text":"沧海桑田；安然无恙；南辕北辙"}],"answer":"A","explanation":"“苦心孤诣”指费尽心思钻研经营；“奄奄一息”形容濒于衰亡；“息息相关”表示关系密切。","source":"《2026(1 综合测试）》第88页","incomplete":false},{"id":182,"category":"词语辨析","stem":"天山绵延几千里，雪峰、深谷处处都有丰饶物产和____的美景。填入最恰当的一项是（ ）。","options":[{"key":"A","text":"美丽"},{"key":"B","text":"奇丽"},{"key":"C","text":"艳丽"},{"key":"D","text":"华丽"}],"answer":"B","explanation":"“奇丽”指奇特而美丽，适合描写天山多样、壮美而独特的自然景观。","source":"《2026(1 综合测试）》第88页","incomplete":false},{"id":183,"category":"管理学","stem":"组织结构设置不合理，导致一个下级同时接受多个上级领导，这种现象称为“多头领导”。下列俗语最能体现这一问题的是（ ）。","options":[{"key":"A","text":"三个和尚没水吃"},{"key":"B","text":"塞翁失马，焉知非福"},{"key":"C","text":"一叶障目，不见泰山"},{"key":"D","text":"众人拾柴火焰高"}],"answer":"A","explanation":"多头领导会造成职责不清、相互推诿，“三个和尚没水吃”形象地反映了这一问题。","source":"《2026(1 综合测试）》第89页","incomplete":false},{"id":184,"category":"医学常识","stem":"亚健康是健康与疾病之间的过渡状态。下列现象最符合亚健康特征的是（ ）。","options":[{"key":"A","text":"外伤后在医院进行康复治疗"},{"key":"B","text":"已确诊急性传染病并发热"},{"key":"C","text":"长期劳累、检查发现异常，但尚无明显疾病症状"},{"key":"D","text":"身体健康且各项指标正常"}],"answer":"C","explanation":"亚健康强调尚未达到明确疾病诊断，却已出现功能下降、指标异常或不适。长期劳累且检查有异常、尚无明显症状最符合。","source":"《2026(1 综合测试）》第89页","incomplete":false},{"id":185,"category":"词语辨析","stem":"为了躲避敌人的搜捕，她____成一名普通村民。填入最恰当的一项是（ ）。","options":[{"key":"A","text":"化装"},{"key":"B","text":"化妆"},{"key":"C","text":"乔装打扮地化妆"},{"key":"D","text":"美容"}],"answer":"A","explanation":"“化装”指改变装束、容貌以掩饰身份；“化妆”侧重用化妆品修饰容貌。","source":"《2026(1 综合测试）》第89页","incomplete":false},{"id":186,"category":"成语辨析","stem":"古筝悠扬，清茶沁人，加之窗外西湖美景，令人心旷神怡，几乎（ ）。","options":[{"key":"A","text":"乐不思蜀"},{"key":"B","text":"感慨万千"},{"key":"C","text":"诗兴大发"},{"key":"D","text":"物我两忘"}],"answer":"D",   const ids=state.order;
  return ids.map(id=>QUESTIONS[id-1]).filter(q=>{

        ${q.incomplete?'<span class="badge warn">原题信息不完整</span>':""}
      </div>
      <div class="qnum">题库第 ${q.id} 题 · 当前 ${state.index+1}/${list.length}</div>
    </div>
    <div class="stem">${esc(q.stem)}</div>
    <div class="options">${optionHtml}</div>
    ${rec?`<div class="explain">
      <div><strong>${rec.correct?"✓ 回答正确":"✗ 回答错误"}</strong>　你的答案：${esc(rec.choice)}　正确答案：${esc(q.answer)}</div>
      <div style="margin-top:8px">${esc(q.explanation)}</div>
      <details class="source"><summary>查看题目来源</summary><div style="margin-top:6px">${esc(q.source)}</div></details>
    </div>`:""}
    <div class="nav">
      <button id="prevBtn" class="secondary">← 上一题</button>
      <button id="favBtn" class="secondary">${fav?"★ 已收藏":"☆ 收藏"}</button>
      <button id="clearOne" class="secondary">${rec?"重做本题":"跳过"}</button>
      <span class="spacer"></span>
      <button id="nextBtn" class="primary">${state.index===list.length-1?"到最后了":"下一题 →"}</button>
    </div>
    <div class="saveNote">快捷键：<span class="kbd">1-4</span> 选 A-D　<span class="kbd">←</span><span class="kbd">→</span> 切题　<span class="kbd">F</span> 收藏</div>
  `;
  quiz.querySelectorAll(".option").forEach(el=>el.onclick=()=>{
    if(state.answers[q.id]) return;
    const choice=el.dataset.key;
    state.answers[q.id]={choice,correct:choice===q.answer,at:new Date().toISOString()};
    save();render();
  });
  $("#prevBtn").onclick=()=>move(-1);
  $("#nextBtn").onclick=()=>move(1);
  $("#favBtn").onclick=()=>{state.favorites[q.id]=!fav;save();render()};
  $("#clearOne").onclick=()=>{
    if(rec){delete state.answers[q.id];save();render()}
    else move(1);
  };
}
function move(d){
  const l=filtered(); if(!l.length)return;
  state.index=Math.max(0,Math.min(l.length-1,state.index+d));save();render();
}
mode.onchange=()=>{state.mode=mode.value;state.index=0;save();render()};
category.onchange=()=>{state.category=category.value;state.index=0;save();render()};
$("#shuffleBtn").onclick=()=>{
  const a=QUESTIONS.map(q=>q.id);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  state.order=a;state.index=0;save();render();toast("已随机打乱")
};
$("#resetOrderBtn").onclick=()=>{state.order=QUESTIONS.map(q=>q.id);state.index=0;save();render();toast("已恢复顺序")};

$("#timerToggle").onclick=()=>{
  if(state.timerRunning){syncTimer();state.timerRunning=false}
  else{state.timerRunning=true;state.lastTick=Date.now()}
  $("#timerToggle").textContent=state.timerRunning?"暂停":"继续";
  save();
};
$("#timerReset").onclick=()=>{if(confirm("重置本次计时？")){state.elapsed=0;state.lastTick=Date.now();save()}};
$("#timerToggle").textContent=state.timerRunning?"暂停":"继续";

$("#saveExit").onclick=()=>{syncTimer();save();toast("进度已保存，可以放心退出")};
$("#exportBtn").onclick=()=>{
  syncTimer();save();
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="综合测试刷题存档_"+new Date().toISOString().slice(0,10)+".json";a.click();URL.revokeObjectURL(a.href)
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const obj=JSON.parse(await f.text());const incoming=obj.state||obj;
    state={...defaults,...incoming,lastTick:Date.now()};
    if(!Array.isArray(state.order)||state.order.length!==QUESTIONS.length)state.order=QUESTIONS.map(q=>q.id);
    save();mode.value=state.mode;category.value=state.category;render();toast("存档导入成功");
  }catch(err){alert("存档格式无法识别")}
  e.target.value="";
};
$("#clearBtn").onclick=()=>{
  if(confirm("确定清空所有作答、错题、收藏和计时吗？此操作不可撤销。")){
    state={...defaults,order:QUESTIONS.map(q=>q.id),lastTick:Date.now()};save();mode.value="all";category.value="ALL";render()
  }
};
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;
  const l=filtered(),q=l[state.index];if(!q)return;
  if(["1","2","3","4"].includes(e.key)&&!state.answers[q.id]){
    const choice="ABCD"[+e.key-1];state.answers[q.id]={choice,correct:choice===q.answer,at:new Date().toISOString()};save();render()
  }else if(e.key==="ArrowRight")move(1);
  else if(e.key==="ArrowLeft")move(-1);
  else if(e.key.toLowerCase()==="f"){state.favorites[q.id]=!state.favorites[q.id];save();render()}
});
render();
</script>
</body>
</html>
